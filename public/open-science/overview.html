ogo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills project mark\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">51.7K ★ ↗</span></div><p class=\"source-desc\">Scientific discovery, writing, visualization and peer review</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA mark\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">503 ★ ↗</span></div><p class=\"source-desc\">BioNeMo Agent Toolkit · Protein, molecule and genomics workflows</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>YOUR SKILL → MARKETPLACE</b><p>After review, researchers worldwide can load, validate, reuse and improve it together.</p></div></div>\n </div>\n </div>\n <p class=\"summary\">Find, install and update capabilities as needed, and contribute your own methods to the community.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The previous page answers which technology to run. This page answers which professional method the task should follow.</p><p><strong>Skill:</strong> Load a defined set of steps, tool calls and checks when a task needs a repeatable method. <strong>Specialist:</strong> Use a professional role to organize the plan and execution around domain requirements. <strong>Unified Resource Center:</strong> Skills, Connectors, Specialists and Use Cases share one entry point, filters and detail views. v1.2.1 adds Specialist installation on Web and retains search, pagination and scroll state.</p><p><strong>Research case library:</strong> Import a publicly validated research package from the home page, replace the materials and continue with a known workflow. <strong>Create and import:</strong> Turn a mature method into a Skill in natural language or import it from GitHub, then test and improve it across real tasks.</p><p>The repository Stars shown on the slide are public-interest snapshots from November 2, 2026. They do not measure method quality, Open-Science usage or fitness for a particular task.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Current README: 24 built-in Skills, 525 Marketplace Skills, 10 Specialists and 48 Connectors</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.4\" target=\"_blank\" rel=\"noopener\">v1.0.4: import Skills from GitHub</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.5\" target=\"_blank\" rel=\"noopener\">v1.0.5: home research case library and validated packages</a><br><a href=\"https://github.com/aipoch/openscience-skill-marketplace\" target=\"_blank\" rel=\"noopener\">Skills Marketplace</a><br><a href=\"https://github.com/aipoch/openscience-specialist-marketplace\" target=\"_blank\" rel=\"noopener\">Specialist Marketplace</a><br>GitHub Stars snapshots on 2026-11-02: <a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense</a>, <a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a>, <a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a>, <a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a>, <a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a>.</div></aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"11\" data-title=\"From scientific capability to real research execution\">\n <div class=\"kicker\">10 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">From scientific capability to <span class=\"highlight-text\">real research execution</span></h2>\n <p class=\"subtitle\">Local and remote work runs within approved scope. Long jobs continue in the background, and remote result collection can recover after a restart.</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"Four research execution capabilities\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>Define the task</b><small>Review a plan when one is needed</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>Delegate when needed</b><small>Enable Delegation for suitable tasks</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>Tools, background and remote jobs</b><small>Approve target, resources and outputs; recover collection</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>Enable Reviewer as needed</b><small>Check the turn's records and evidence</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK &amp; PLANNING</strong><span>Choose Plan first from the send menu</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/fe15b6afd5265d52.png\" src=\"/open-science/assets/38065007e7bdc467.png\" alt=\"Local Open-Science v1.2.1 Plan first entry in the send menu; demonstration draft not submitted\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>PLAN FIRST · LOCAL v1.2.1</span><span>Plan first entry · Unsent demonstration draft</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / OPTIONAL DELEGATION</strong><span>Enable session-level Delegation when needed</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/77500b590198b638.png\" src=\"/open-science/assets/8005fae187dc7e05.png\" alt=\"Local Open-Science v1.2.1 session-level Delegation toggle in Agent controls\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>AGENT CONTROLS · DELEGATION</span><span>Optional session-level delegation toggle</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / TOOLS &amp; BACKGROUND EXECUTION</strong><span>Inspect Notebook code in a completed tool step</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/4740847d26e7d369.png\" src=\"/open-science/assets/1de90ff3593c227e.png\" alt=\"Local Open-Science v1.2.1 completed Notebook tool step expanded to show executed code\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · ACTUAL EXECUTION RECORD</span><span>Actual execution record · Expand to inspect code</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / OPTIONAL REVIEWER</strong><span>Optional checks support the researcher's judgment</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/d291b7ff8a05f310.png\" src=\"/open-science/assets/3abc34b0dec54a9e.png\" alt=\"Local Open-Science v1.2.1 Request review entry in the composer plus menu; no review started\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>REQUEST REVIEW · CONVERSATION ACTIONS</span><span>Composer + menu · Request review entry</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">You steer the research. The agent runs real tools, with Delegation and Reviewer checks available when needed.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page shows how researchers confirm direction, divide work, wait for long jobs and add checks after execution begins.</p><p><strong>Plan:</strong> Review a plan when the task is complex or has explicit deliverables. Simple tasks do not have to pass through this step. <strong>Delegation:</strong> When work separates into independent parts, enable Sub-agents and let the main Agent combine their results. Delegation remains optional.</p><p><strong>Real tool execution:</strong> The Agent calls actual tools for computation, queries and file generation. <strong>Background and remote jobs:</strong> Supported work continues in the background. Kubernetes, Hugging Face Jobs, Modal and Ray confirm the target, command, resources and outputs before submission, then recover result collection after a restart. <strong>Reviewer:</strong> Enable an extra check for methods, evidence or wording when needed. Reviewer cannot replace the researcher’s scientific judgment or artifact reproducibility verification.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.27.0\" target=\"_blank\" rel=\"noopener\">v0.27.0: background jobs and automatic result delivery</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.6\" target=\"_blank\" rel=\"noopener\">v1.0.6: artifact publishing during an open long-running turn</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: Kubernetes, Hugging Face Jobs, Modal and Ray jobs</a><br>The four screenshots were captured locally from Open-Science v1.2.1 on November 12, 2026: the Plan first send menu, the Delegation toggle, a completed Notebook step and the Request review entry. The slide enlarges the relevant controls; click to inspect each complete screenshot. The planning draft was not submitted. No new research or review was started. The Delegation capture shows the toggle, not five running sub-agents.</div></aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"12\" data-title=\"Research materials and results, managed together and traceable\">\n <div class=\"kicker\">11 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">Research materials and results, managed together.<br><span class=\"highlight-text\">Inspectable and traceable throughout.</span></h2>\n <p class=\"subtitle\">Keep materials, artifact versions and execution records connected so researchers can inspect, revise and verify them in one workspace.</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"Four capabilities for materials, artifacts, provenance and control\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS</b><small>Project files, attachments up to 10 GiB each, and @ / # references.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS &amp; VERSIONS</b><small>Edit text, save a new version and compare. Image annotations are optional.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE</b><small>Connect inputs, code, runtime and available execution records.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL</b><small>Set network boundaries for Notebooks and Connectors by domain.</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / REFERENCES &amp; FILES</strong><span>Add, organize and reference source material</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceMaterials|0,500,2113,780\" style=\"aspect-ratio:2113/780\"><img src=\"/open-science/assets/a7178411fafa9747.png\" alt=\"Local Open-Science v1.2.1 Files view for uploaded materials and generated outputs\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / EDIT · SAVE A NEW VERSION · COMPARE</strong><span>Revise only if needed. Keep the original version.</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"textCompare|84,63,1494,382\" style=\"aspect-ratio:1494/382\"><img src=\"/open-science/assets/22ced33ceef0ce74.png\" alt=\"Local Open-Science v1.2.1 artifact version view with v2, version navigation and source comparison\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>TEXT VERSION · v1 → v2 · SYNTHETIC DEMO</span><div class=\"evidence-example-links\"><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/22ced33ceef0ce74.png\" alt=\"Local Open-Science v1.2.1 Markdown artifact with preview, edit, compare and download actions\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"><figcaption>See the text editor ↗</figcaption></figure><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/4615fe26a153eaf7.png\" alt=\"Local Open-Science v1.2.1 image artifact with findings and chart preview in one workspace\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"><figcaption>Optional image annotation ↗</figcaption></figure></div></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>Trace an artifact back to code, tool calls and environment</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceProvenance|1480,0,1080,720\" style=\"aspect-ratio:1080/720\"><img src=\"/open-science/assets/1bd785ee750bd9c5.png\" alt=\"Local Open-Science v1.2.1 execution record with Notebook work, tool calls, inputs, outputs and artifacts\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>The run record persists</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>Define network boundaries for Notebooks and Connectors</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceControl|580,250,1400,950\" style=\"aspect-ratio:1400/950\"><img src=\"/open-science/assets/330610a8f735bb5c.png\" alt=\"Local Open-Science v1.2.1 Runtimes with Notebook environments and network protection\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · CONNECTORS · DOMAIN RULES</span><span>Controlled access · Network protection</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Results can be inspected and delivered as they are. Revise only when needed, while preserving versions and how each result was produced.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page explains how research results are delivered and inspected through versions, provenance and access controls.</p><p><strong>Materials:</strong> Keep input and generated files together and reference them with @ or #. <strong>Artifact inspection and optional revision:</strong> Download and deliver figures, reports or Notebooks as they are. Edit text, save another version or annotate an image only when a change is needed. <strong>Version comparison:</strong> Compare the old and new versions while keeping the original.</p><p><strong>Provenance, source previews and RO-Crate:</strong> Inspect code, inputs, execution records and environment information. Hover over approved HTTPS sources to preview destination metadata, and export an RO-Crate for verified artifacts. <strong>Reproducibility verification:</strong> When capture is complete, rerun a specific artifact version and compare outputs. A successful check shows that computation was reproduced; it does not prove the scientific conclusion. <strong>Control:</strong> Review approval requests and network rules when sensitive material or external services are involved.</p><p>The next slide separately explains how .science packages hand the result and selected research process to a collaborator.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.25.0\" target=\"_blank\" rel=\"noopener\">v0.25.0: source editing, new versions and Compare</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.32.0\" target=\"_blank\" rel=\"noopener\">v0.32.0: complete RO-Crate export for verified artifacts</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: source previews and step-linked discussions for imported research</a><br><a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">PR #1815: optional Annotation</a><br>Local light-mode editor and v2 comparison captured 2026-09-17. Files, Annotation, Execution Log and Network screenshots were supplied earlier.</div></aside>\n</section>\n\n<section class=\"slide slide-surface science-package\" data-page=\"13\" data-title=\".science research package: deliver results with their process\">\n <div class=\"kicker\">12 / PORTABLE RESEARCH PACKAGE</div>\n <h2 class=\"section-title\"><span class=\"highlight-text\">.science research package</span>: results and process together</h2>\n <p class=\"subtitle\">Choose the path, file versions and evidence for a more compact .science export. After import, ask from a specific step; Fork only for execution or editing.</p>\n <div class=\"science-package-layout\" data-science-package-layout>\n  <div class=\"science-package-steps\" aria-label=\"What a .science research package contains\">\n   <div class=\"science-package-step\" aria-selected=\"true\"><span class=\"sp-num\">01</span><span><b>Conversation branches</b><small>Preserve the question, research choices and exploration paths</small></span></div>\n   <div class=\"science-package-step\" aria-selected=\"false\"><span class=\"sp-num\">02</span><span><b>Selected files</b><small>Include the materials, results and versions that matter</small></span></div>\n   <div class=\"science-package-step\" aria-selected=\"false\"><span class=\"sp-num\">03</span><span><b>Evidence records</b><small>Keep available sources, citations and related execution records</small></span></div>\n   <div class=\"science-package-step\" aria-selected=\"false\"><span class=\"sp-num\">04</span><span><b>Export, import and discuss</b><small>Inspect read-only, ask from a step or Fork to continue</small></span></div>\n  </div>\n  <div class=\"science-package-stage\">\n   <iframe class=\"science-code-frame\" data-science-code-frame allowtransparency=\"true\" title=\"Live .science package animation showing conversation branches, selected files and evidence records combined into one portable research package\"></iframe><div class=\"science-v121-flow\" aria-label=\"v1.2.1 package flow\"><span><b>01 · EXPORT</b>Compact package</span><span><b>02 · IMPORT</b>Read-only replay</span><span><b>03 · DISCUSS</b>Ask from a step</span><span><b>04 · FORK</b>Continue when needed</span></div>\n  </div>\n </div>\n <div class=\"summary\"><i></i><span>Imported records stay read-only. Step discussions do not alter the package; Fork only for execution or editing.</span></div>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">This page shows how a .science research package differs from a standard report. It carries the result together with the selected research path, materials and evidence records that produced it.</p>\n<ul>\n <li><strong>Conversation branches:</strong> Use them when a supervisor or collaborator needs to understand why the analysis followed a particular path. They preserve the key decisions instead of leaving only the final answer.</li>\n <li><strong>Selected files:</strong> Use them when a project contains many inputs and intermediate results but the handoff needs only the material relevant to the current conclusion. The recipient can see exactly which versions were included.</li>\n <li><strong>Evidence records:</strong> Use them when the recipient needs to check the sources, citations or execution records behind a conclusion.</li>\n <li><strong>Export:</strong> Choose Essential, Full or custom contents from the session export entry to create a portable .science file. Review sensitive data and credentials before sharing.</li>\n <li><strong>Receive, discuss and continue:</strong> The recipient inspects the path, files and evidence read-only. A question from a replay step opens a linked child discussion; execution or editing begins only after Forking to a writable path.</li>\n <li><strong>Boundary:</strong> The package supports handoff and review. It does not execute code automatically and does not replace an artifact reproducibility check, which still requires complete captured inputs and environment records.</li>\n</ul>\n<p>The next slide shows how the same research record can become a portable narrated film.</p>\n<details class=\"sources\"><summary>Sources and demo notes</summary>\n<p>The animation embeds the HTML, SVG and JavaScript from the user-provided Shanghai Jiao Tong University School of Medicine workshop deck and scales it for this presentation. It is live code, not a screenshot, GIF or recording. The animation code comes from the workshop deck. Product boundaries are updated through Open-Science v1.2.1.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1: more compact research exports</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: step-linked discussions and the clearer Fork action</a></p>\n</details>\n </aside>\n</section>\n<template id=\"science-package-animation-template\"><style>\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F7F7F4;font-family:Arial,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n.slide{position:relative;width:100%;height:100%;overflow:hidden;background:#F7F7F4}\n.science-story-page{position:absolute;inset:0;overflow:hidden;background:#F7F7F4;color:#111210}\n.science-story-page>*{display:none!important}\n.science-story-page .ss-hairline-stage{display:block!important;position:absolute;left:7%!important;top:15px!important;width:86%!important;height:430px!important;transform:translateY(-75px) scale(.84);transform-origin:50% 50%;pointer-events:auto}\n.science-story-page .ss-hairline-host{position:absolute;inset:0;pointer-events:auto;--hairline-plate:#f4f1ec;--hairline-hi:#d1a628;--hairline-edge:#292a23;--hairline-mid:#7e786c;--hairline-lo:#aaa08e;--hairline-stroke:1.35}\n.science-story-page .ss-hairline-host svg{overflow:visible;pointer-events:auto}\n.science-story-page .ss-point-label,.science-story-page .ss-package-label,.science-story-page .ss-file-mark{display:none!important}\n.science-story-page .ss-cover-brand{fill:#4d483d;stroke:none;font-family:Arial,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n</style><div class=\"slide active\" data-slide=\"2.8\"></div><script>/* hairline kernel sha256:346b48bdef2cdfafd5343eba01494255cf75f9c078e6fcd1aafc62bab62980a1 */\n/*\n * HL: everything a figure may call. Read this index; the code under it is the\n * package's src/core, unchanged, and a figure should not need to read it.\n *\n * Every figure is drawn in a 400 × 320 viewBox. World space is x/y on the\n * ground and z up. Plates are filled with the ground colour and painted back\n * to front, so a nearer one covers a farther one: append in that order. At\n * the defaul stener('pointerleave',()=>{leave=setTimeout(release,160);});hit.addEventListener('click',e=>e.stopPropagation());});\n rows.forEach((r,i)=>{r.addEventListener('pointerenter',()=>inspect(i));r.addEventListener('pointerleave',()=>{leave=setTimeout(release,160);});});\n return function(t){const now=performance.now();if(s.hover>=0&&now>=s.hoverUntil){release();t=s.t;}const n=s.hover>=0?s.hover:Math.floor(t/6400)%3;\n  if(n!==selected){const first=selected<0;selected=n;revealAt=now+(first?0:180);rows.forEach((r,i)=>r.classList.toggle('on',i===n));contentGroups.forEach(g=>g.classList.remove('on'));layers.forEach((l,i)=>{l.g.classList.toggle('on',i===n);tset(l.tw,allowLift&&i===n?-15:0,now,Math.abs(i-n)*35);});}\n  if(revealAt>=0&&now>=revealAt){contentGroups[selected].classList.add('on');revealAt=-1;}\n  layers.forEach(l=>{const v=tval(l.tw,now);if(v!==l.last){l.g.setAttribute('transform','translate(0 '+v+')');l.last=v;}});\n };\n}\n\nHL.inject(document);states.forEach(s=>s.visual=s.story.num==='4'?makeArchive(s):makeVisual(s));\n\nfunction pack(s,t){s.intro=false;const n=Math.min(3,Math.floor(t/3600));narrate(s,s.hover>=0?s.hover:n);s.visual(t,n);}\nfunction share(s,t){s.visual(t);}\nlet raf=0,last=0,live=null;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction frame(now){raf=0;if(!live||document.hidden)return;const dt=last?now-last:0;last=now;if(live.hover<0&&!(live.settleUntil>now))live.t=(live.t+dt)%(live.story.num==='3'?16800:19200);(live.story.num==='3'?pack:share)(live,reduced&&live.story.num==='3'?15500:live.t);if(!reduced||live.story.num==='4')raf=requestAnimationFrame(frame);}\nfunction sync(){const next=states.find(s=>s.slide.classList.contains('active'))||null;if(next!==live){live=next;if(live){live.t=0;live.phase=-1;if(live.story.num==='4'){live.hover=-1;live.hoverUntil=0;}}last=0;}if(raf){cancelAnimationFrame(raf);raf=0;}if(live&&!document.hidden)raf=requestAnimationFrame(frame);}\nconst obs={disconnect(){}};document.addEventListener('visibilitychange',()=>{last=0;sync()});states.forEach(s=>(s.story.num==='3'?pack:share)(s,0));sync();window.addEventListener('pagehide',()=>{if(raf)cancelAnimationFrame(raf);obs.disconnect()});\n})();\n<\/script></template>\n\n<section class=\"slide slide-dark research-film\" data-page=\"14\" data-title=\"Research film: export the .science story as video\">\n <div class=\"kicker\">13 / RESEARCH FILM</div>\n <h2 class=\"section-title research-film-title-en\"><span class=\"highlight-text\">Research film</span>: export the .science story as video</h2>\n <p class=\"subtitle\">Freeze a completed session or imported .science path, generate English narration and captions, export MP4 from Desktop, and recover after session switches.</p>\n <div class=\"research-film-layout\">\n  <div class=\"research-film-flow\" aria-label=\"Research film workflow\">\n   <div class=\"research-film-step\"><span class=\"rf-num\">01</span><span><b>Select the research path</b><small>Start from a completed session or imported .science record</small></span></div>\n   <div class=\"research-film-step\"><span class=\"rf-num\">02</span><span><b>Generate the explanation</b><small>Write scenes and animation, then align English narration and captions</small></span></div>\n   <div class=\"research-film-step\"><span class=\"rf-num\">03</span><span><b>Review portable playback</b><small>Save a standalone HTML player and source ZIP</small></span></div>\n   <div class=\"research-film-step\"><span class=\"rf-num\">04</span><span><b>Export MP4 when needed</b><small>Save a 1280 × 720, 16:9 video from Desktop</small></span></div>\n  </div>\n  <div class=\"research-film-visual\">\n   <div class=\"research-film-demo\">\n    <video controls playsinline preload=\"metadata\" poster=\"/open-science/assets/5af59e07c9e7f8b5.png\" onkeydown=\"event.stopPropagation()\" aria-label=\"Can We Reproduce Chinchilla Scaling research film\">\n     <source src=\"/open-science/assets/f25b88730c7cd12a.mp4\" type=\"video/mp4\">\n    </video>\n   </div>\n   <div class=\"research-film-caption\"><strong>CAN WE REPRODUCE CHINCHILLA SCALING?</strong><span>4K · 2:10 · <a href=\"/open-science/assets/f25b88730c7cd12a.mp4\" target=\"_blank\" rel=\"noopener\">Open video ↗</a></span></div>\n  </div>\n </div>\n <div class=\"summary\"><i></i><span>For presentations, handoffs and asynchronous review. The film explains the record; it does not replace evidence or reproducibility checks.</span></div>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">This page shows how a completed .science research record can become a portable narrated Research film. The feature is for explaining finished work, not for running the research itself.</p>\n<ul>\n <li><strong>Select the research path:</strong> Use this when a project has several exploration branches but the film should explain one completed path. Choose <strong>Generate research film</strong> from the actions for a completed session or imported record. The selected branch and supported images are frozen so the film stays tied to a specific research record.</li>\n <li><strong>Generate the explanation:</strong> Use this when a long session needs a concise visual narrative. The system writes the screenplay and animation scripts, generates English narration and aligns captions. Generation can continue in the background, reducing manual editing and screen recording.</li>\n <li><strong>Portable playback:</strong> Use this when the recipient needs to watch the result without opening the original session. The default output is a standalone HTML player plus a source ZIP, keeping narration, captions, animation and referenced images together.</li>\n <li><strong>MP4 export:</strong> Use this for meetings, courses or general video platforms. Desktop can save the film as a 1280 × 720, 16:9 MP4 after the required narration and encoding components are available.</li>\n <li><strong>In-slide demo:</strong> The player shows Can We Reproduce Chinchilla Scaling, the supplied 4K, 16:9 MP4 lasting about 2 minutes 10 seconds. Play it directly on this slide or use the link below to open the video separately.</li>\n <li><strong>Boundary:</strong> Narration is currently English. Researchers still need to check scientific accuracy and sharing scope. A Research film explains and communicates the record; it does not replace the .science package, original evidence or a reproducibility check.</li>\n</ul>\n<p>The record can now be inspected and explained. The next slide places Open-Science, scientific capabilities and the technical foundation back into AIPOCH’s broader product architecture.</p>\n<details class=\"sources\"><summary>Sources and demo notes</summary>\n<p>The video is Can We Reproduce Chinchilla Scaling · 16×9 4k.mp4, supplied by the user on November 12, 2026. Its original resolution is 3840 × 2160 and its duration is 129.717 seconds. The poster is a frame from the same video. Keep the HTML and /open-science/assets/f25b88730c7cd12a.mp4 in the same folder for offline playback.</p>\n[Sources]<br>User-supplied local Research film MP4, November 12, 2026.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1: Research film recovery across session switches</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.1.0\" target=\"_blank\" rel=\"noopener\">v1.1.0: Research films and MP4 export</a><br><a href=\"https://github.com/aipoch/open-science/blob/main/packages/research-film/resources/authoring/README.md\" target=\"_blank\" rel=\"noopener\">Research film generation, playback and export workflow</a>\n</details>\n </aside>\n</section>\n<section class=\"slide architecture\" data-page=\"15\" data-title=\"AIPOCH builds open research infrastructure\">\n <div class=\"kicker\">14 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH builds <span class=\"highlight-text\">open research infrastructure</span></h2>\n <p class=\"subtitle\">Open-Science is the open entry point for researchers and the global community, supported by specialist capabilities, execution engines and technical services.</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH product architecture represented as a building with services, capabilities, execution and an open research space\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>An open research workbench and community entry point for researchers<span class=\"benchmark-result\"><b>79.05 / 100</b>BIOMNIBENCH-DA PUBLIC 50 · INTERNAL</span></p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">SOON</span></h3><p>Coming soon: resumable research workflows built from specialist capabilities</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>24 built-in · 525 Marketplace · 10 Specialists · 48 Connectors</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Open-Science Agent · Model · Compute</h3><p>6 agent options · Local and remote runtimes · Data services</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>GLOBAL OPEN RESEARCH COMMUNITY</strong>　Contribute · Review · Collaborate · Reuse</div></div>\n <p class=\"summary\">AIPOCH turns models, tools and research expertise into capabilities the global community can use and improve.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The architecture is shown from the AIPOCH company perspective: Open-Science is the open entry point, supported by execution, capability and technical layers.</p><p>The upper space is Open-Science, containing projects, sessions, context, files and research outputs. MedFlow is marked SOON and is intended to organize validated capabilities into executable, recoverable workflows. The capability layer contains Specialists, Skills and Connectors. MedSkillAudit is live for Skill audits and ratings, with public entry points for Benchmark and Leaderboard work. The current README reports an internal BiomniBench-DA Public 50 mean judge score of 79.05 / 100; it is not an official ranking under one common judging procedure. The foundation provides models, agents, compute, environments and data services.</p><p>This is a conceptual product architecture, not a deployment topology. The space around the building represents the global open research community contributing, validating, collaborating and reusing capabilities.</p><div class=\"sources\">[Sources]<br>AIPOCH 2026 mid-year architecture artwork; architecture framing and product status confirmed by AIPOCH; <a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">current Open-Science README: capability counts, compute backends and internal BiomniBench-DA notes</a>; <a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0 release notes</a>; <a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH website</a>.</div></aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"16\" data-title=\"A global community expands the boundaries of capability together\">\n <div class=\"kicker\">15 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">A global community expands <span class=\"highlight-text\">the boundaries of capability</span></h2>\n <p class=\"subtitle\">The community contributes specialist capabilities. AIPOCH provides the infrastructure and collaboration mechanisms for sustained co-building.</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>Researchers</h3><p>Use community-built capabilities<br>and bring back real questions.</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>Domain experts</h3><p>Package methods and judgment<br>as Specialists or Skills.</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-<br>Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>Developers</h3><p>Connect tools, data sources<br>and workflow components.</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>Institutions</h3><p>Run validation, reproduction<br>and collaborative studies.</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH pixel sticker for community support\"><div><span>AIPOCH / COMMUNITY INITIATOR</span><b>Initiating and advancing<br>the community</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>Open infrastructure</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>Online &amp; in-person workshops</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>Collaborative projects with research groups</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skills Hub<br>Specialist Marketplace</strong></div></div></div>\n <aside class=\"notes\"><p class=\"speaker-summary\">The community contributes scientific capability; AIPOCH provides infrastructure, programs and collaboration mechanisms that help co-creation continue.</p><p>The community has four roles: researchers, domain experts, developers and research institutions. Researchers use capabilities and return real problems. Domain experts codify Specialists and Skills. Developers connect tools, data sources and workflow components. Institutions support validation, reproduction and collaborative research.</p><p>AIPOCH is not a fifth community role. It convenes and supports the community through open infrastructure, online and in-person workshops, research-group collaborations, a Skills Hub and a Specialist Marketplace. Contributors decide what to publish; private research data does not have to be made public. Research collaborations are agreed project by project.</p><div class=\"sources\">[Sources]<br>Global open research community positioning, four contribution roles and AIPOCH support model specified by AIPOCH. Pixel-sticker artwork supplied and adapted for this deck.</div></aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"17\" data-title=\"One contribution can become the start of the next scientific discovery\">\n <div class=\"kicker\">16 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">One contribution can become<br><span class=\"highlight-text\">the start of the next discovery</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">Methods and experience from real research can be validated, published and reused in new studies.</p><div class=\"participation\"><div><b>USE</b><span>Apply an existing capability</span></div><div><b>CONTRIBUTE</b><span>Share a method or component</span></div><div><b>VALIDATE</b><span>Review, reproduce, challenge</span></div><div><b>CO-CREATE</b><span>Work together on a real question</span></div></div><p class=\"fine\" style=\"margin-top:29px\">The collaboration model we hope to build with the global research community.</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">Shared<br>capability<small>TESTED · REUSABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>Research question</span><small>Start with a real need</small></div><div class=\"wheel-node wn2\"><b>02</b><span>Collaborate</span><small>Bring the right disciplines together</small></div><div class=\"wheel-node wn3\"><b>03</b><span>Package the method</span><small>Skill or Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>Test it</span><small>Methods, limits, results</small></div><div class=\"wheel-node wn5\"><b>05</b><span>Publish &amp; reuse</span><small>Keep source and version</small></div><div class=\"wheel-node wn6\"><b>06</b><span>Learn from use</span><small>New cases, better capability</small></div></div></div>\n <p class=\"summary\">Turn the experience from one project into capability more researchers can use.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page shows how methods and feedback from one collaboration can support later studies.</p><p>A real task can produce a new method or a useful improvement. After documentation and testing, that work can become a capability other projects load when needed. Reuse should preserve version, source and conditions of use instead of applying one successful method to every context. New problems discovered through reuse help contributors improve the capability.</p><p>This slide describes the collaboration model AIPOCH hopes to build. It does not imply that every review, publishing, governance or partnership workflow is already available. Broader capability sharing and real-time cross-institution collaboration remain future directions.</p><div class=\"sources\">[Sources]<br>Community vision, co-building loop and future directions confirmed by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"18\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Open research infrastructure connected to a global community\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">Make expert scientific capabilities accessible.<br>Put choice back in researchers’ hands.</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN-SOURCE<br>RESEARCH COMMUNITY<span class=\"version\">PRODUCT SNAPSHOT<br>v1.2.1 · 2026.11.11</span></div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>Explore Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>Build with us on GitHub ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>Partner with AIPOCH ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"QR code for the Open-Science product page\"><p>Explore Open-Science</p></a>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">The core idea is simple: give researchers the freedom to choose their technical environment and help them turn a question into an inspectable result that others can continue.</p>\n<ul>\n <li><strong>If you are running a study:</strong> Bring a paper, dataset or analysis goal, and we can start from a concrete research question.</li>\n <li><strong>If you have a proven method:</strong> We can define its conditions, inputs, outputs and evaluation criteria, then package it as a reusable Skill or Specialist.</li>\n <li><strong>If you want to contribute:</strong> Start by using, testing or validating the workbench, or contribute a tool, connector or research case.</li>\n</ul>\n<p>Thank you. We welcome a conversation that starts with a real research problem.</p>\n<details class=\"sources\"><summary>Sources and demo notes</summary>\n<p>This presentation reflects Open-Science v1.2.1, released on November 11, 2026, and was updated on November 12, 2026. Some interfaces use historical screenshots, with versions and sources listed in the relevant slide notes. The QR code points to https://aipoch.com/open-science. Research outputs still require professional review.</p>\n[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science product page</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">Open-Science v1.2.1 release notes</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-source repository</a><br><a href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\">AIPOCH contact page</a><br>Architecture artwork: AIPOCH 2026 mid-year review.\n</details>\n</aside>\n</section>\n</main></div>\n<div class=\"key-hint\">← → SLIDES　O OVERVIEW　N NOTES　F FULLSCREEN</div>\n<nav class=\"controls\" aria-label=\"Presentation controls\"><button id=\"prevBtn\" aria-label=\"Previous slide\" title=\"Previous slide (←)\">←</button><span id=\"slideCounter\" class=\"counter\" aria-live=\"polite\">01 / 18</span><button id=\"nextBtn\" aria-label=\"Next slide\" title=\"Next slide (→)\">→</button><span class=\"sep\"></span><button id=\"overviewBtn\" aria-label=\"Open overview\" title=\"Overview (O)\">Overview</button><button id=\"notesBtn\" aria-label=\"Open speaker notes\" title=\"Speaker notes and sources (N)\">Notes</button><button id=\"fullBtn\" aria-label=\" extContent=role?role.text:'Choose a role to see how each group contributes.';\n  }\n  function bindControl(control,key){\n   control.setAttribute('aria-controls','commonsContext');\n   control.addEventListener('pointerenter',()=>displayRole(key));\n   control.addEventListener('pointerleave',()=>displayRole(pinned));\n   control.addEventListener('focus',()=>displayRole(key));\n   control.addEventListener('click',()=>{pinned=pinned===key?'':key;displayRole(pinned);});\n   control.addEventListener('blur',()=>displayRole(pinned));\n   control.addEventListener('keydown',e=>{\n    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;\n    e.preventDefault();e.stopPropagation();\n    const index=buttons.findIndex(b=>b.dataset.role===key);\n    const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:buttons.length-1))%buttons.length;\n    pinned=buttons[next].dataset.role;buttons[next].focus();displayRole(pinned);\n   });\n  }\n  buttons.forEach(b=>bindControl(b,b.dataset.role));\n  regionButtons.forEach(b=>bindControl(b,b.dataset.region));\n  commons.addEventListener('pointerleave',()=>displayRole(pinned));\n }\n document.querySelectorAll('.gallery').forEach(g=>{const tabs=[...g.querySelectorAll('[role=\"tab\"]')];function select(tab){tabs.forEach(b=>b.setAttribute('aria-selected',b===tab?'true':'false'));g.querySelectorAll('.gallery-panel').forEach(p=>{const selected=p.dataset.panel===tab.dataset.select;p.classList.toggle('active',selected);p.setAttribute('aria-hidden',selected?'false':'true');});}tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();const t=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];select(t);t.focus();});});});\n document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const key=e.key.toLowerCase();if(key==='escape'||key==='esc'){e.preventDefault();dialogs.forEach(d=>d.open&&d.close());document.body.classList.remove('hide-ui');return;}if(key==='o'){e.preventDefault();toggleDialog('overviewDialog');return;}if(key==='n'){e.preventDefault();toggleDialog('notesDialog');return;}if(dialogs.some(d=>d.open))return;if(key==='f'){e.preventDefault();fullscreen();return;}if(key==='h'){document.body.classList.toggle('hide-ui');return;}if((e.key===' '||e.key==='Enter')&&e.target.closest('button,a'))return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showSlide(current+1);}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();showSlide(current-1);}else if(e.key==='Home'){e.preventDefault();showSlide(0);}else if(e.key==='End'){e.preventDefault();showSlide(total-1);}});\n document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;touchTarget=e.target;},{passive:true});document.addEventListener('touchend',e=>{if(dialogs.some(d=>d.open)||!touchTarget||touchTarget.closest('button,a,.controls'))return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)showSlide(current+(dx<0?1:-1));},{passive:true});\n function fromHash(){const m=location.hash.match(/^#slide-(\\d{1,2})$/);showSlide(m?parseInt(m[1],10)-1:0,false);}window.addEventListener('hashchange',fromHash);window.addEventListener('resize',fit);window.addEventListener('fullscreenchange',fit);fit();fromHash();\n})();\n<\/script>\n<script>\n(()=>{'use strict';\n const frame=document.querySelector('[data-science-code-frame]');\n const template=document.getElementById('science-package-animation-template');\n if(!frame||!template)return;\n const slide=frame.closest('.slide');\n const steps=[...slide.querySelectorAll('.science-package-step')];\n const load=()=>{frame.srcdoc='<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"color-scheme\" content=\"light\"><style>html,body{background:#F7F7F4!important}</style></head><body>'+template.innerHTML+'</body></html>';frame.dataset.loaded='1';};\n const sync=()=>{\n  if(slide.classList.contains('active')){if(frame.dataset.loaded!=='1')load();}\n  else if(frame.dataset.loaded==='1'){frame.srcdoc='about:blank';delete frame.dataset.loaded;steps.forEach((step,i)=>step.setAttribute('aria-selected',i===0?'true':'false'));}\n };\n window.addEventListener('message',event=>{\n  if(event.source!==frame.contentWindow||event.data?.type!=='science-package-phase')return;\n  steps.forEach((step,i)=>step.setAttribute('aria-selected',String(i===event.data.phase)));\n });\n new MutationObserver(()=>setTimeout(sync,0)).observe(slide,{attributes:true,attributeFilter:['class']});\n window.addEventListener('hashchange',()=>setTimeout(sync,0));\n sync();\n})();\n<\/script>\n</body>\n</html>\n"};
const frames={zh:document.getElementById('deck-zh'),en:document.getElementById('deck-en')};
const loading=document.getElementById('loading');
const validHash=hash=>/^#slide-\d{2}$/.test(hash||'')?hash:'#slide-01';
const params=new URLSearchParams(location.search);
let stored='';
try{stored=localStorage.getItem('aipoch-deck-language')||''}catch{}
let activeLang=['zh','en'].includes(params.get('lang'))?params.get('lang'):(['zh','en'].includes(stored)?stored:(navigator.language.toLowerCase().startsWith('zh')?'zh':'en'));
let currentHash=validHash(location.hash);
const ready={zh:false,en:false};

function childHash(lang){
  try{
    const active=frames[lang].contentDocument.querySelector('.slide.active');
    if(active&&/^\d{2}$/.test(active.dataset.page||''))return '#slide-'+active.dataset.page;
    return validHash(frames[lang].contentWindow.location.hash);
  }catch{return currentHash}
}

function syncParentHash(hash){
  currentHash=validHash(hash);
  const url=new URL(location.href);
  url.searchParams.set('lang',activeLang);
  url.hash=currentHash;
  if(location.href!==url.href)history.replaceState(null,'',url);
}

function controlMarkup(lang){
  return '<div class="os-language-switch" role="group" aria-label="Switch presentation language">'+
    '<button type="button" data-deck-language="zh" aria-label="切换到中文版">中文</button>'+
    '<button type="button" data-deck-language="en" aria-label="Switch to English">EN</button>'+
    '</div>';
}

function installControl(lang){
  const doc=frames[lang].contentDocument;
  if(!doc||doc.getElementById('os-bilingual-control'))return;
  const style=doc.createElement('style');
  style.id='os-bilingual-control';
  style.textContent='.os-language-switch{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.26);border-radius:999px;background:rgba(17,17,17,.78);box-shadow:0 5px 20px rgba(0,0,0,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:Arial,Helvetica,sans-serif}.os-language-switch button{min-width:48px;height:26px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.72);font:600 11px/26px Arial,Helvetica,sans-serif;letter-spacing:.04em;cursor:pointer}.os-language-switch button:hover{color:#fff}.os-language-switch button.is-active{background:#f5df5e;color:#111}.os-language-switch button:focus-visible{outline:2px solid #f5df5e;outline-offset:2px}@media(max-width:760px){.os-language-switch{top:10px}.os-language-switch button{min-width:43px;height:24px;line-height:24px;padding:0 9px}}';
  doc.head.appendChild(style);
  const holder=doc.createElement('div');
  holder.innerHTML=controlMarkup(lang);
  const control=holder.firstElementChild;
  doc.body.appendChild(control);
  control.querySelectorAll('button').forEach(button=>button.addEventListener('click',event=>{
    event.preventDefault();
    event.stopPropagation();
    void window.__switchDeckLanguage(button.dataset.deckLanguage);
  }));
  updateControls();
}

function updateControls(){
  Object.values(frames).forEach(frame=>{
    try{
      frame.contentDocument.querySelectorAll('[data-deck-language]').forEach(button=>{
        const selected=button.dataset.deckLanguage===activeLang;
        button.classList.toggle('is-active',selected);
        button.setAttribute('aria-pressed',String(selected));
      });
    }catch{}
  });
}

async function exitFullscreen(){
  try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}
  for(const frame of Object.values(frames)){
    try{if(frame.contentDocument.fullscreenElement)await frame.contentDocument.exitFullscreen()}catch{}
  }
}

async function setLanguage(lang,{exitFull=true}={}){
  if(!['zh','en'].includes(lang))return;
  const previous=activeLang;
  if(previous!==lang){try{frames[previous].contentDocument.querySelectorAll('video,audio').forEach(media=>media.pause())}catch{}}
  if(ready[previous])currentHash=childHash(previous);
  if(exitFull)await exitFullscreen();
  activeLang=lang;
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  frames.zh.hidden=lang!=='zh';
  frames.en.hidden=lang!=='en';
  if(ready[lang]){
    try{frames[lang].contentWindow.location.hash=currentHash}catch{}
    loading.hidden=true;
  }
  try{localStorage.setItem('aipoch-deck-language',lang)}catch{}
  syncParentHash(currentHash);
  updateControls();
}

window.__switchDeckLanguage=setLanguage;

Object.entries(frames).forEach(([lang,frame])=>{
  frame.addEventListener('load',()=>{
    ready[lang]=true;
    try{
      frame.contentWindow.location.hash=currentHash;
      frame.contentWindow.addEventListener('hashchange',()=>{
        if(lang===activeLang)syncParentHash(frame.contentWindow.location.hash);
      });
    }catch{}
    installControl(lang);
    try{
      const root=frame.contentDocument.querySelector('main')||frame.contentDocument.body;
      const observer=new frame.contentWindow.MutationObserver(()=>{
        if(lang===activeLang)syncParentHash(childHash(lang));
      });
      observer.observe(root,{subtree:true,attributes:true,attributeFilter:['class','aria-hidden']});
    }catch{}
    if(lang===activeLang){frame.hidden=false;loading.hidden=true}
  });
  frame.srcdoc=documents[lang];
});

window.addEventListener('hashchange',()=>{
  currentHash=validHash(location.hash);
  try{frames[activeLang].contentWindow.location.hash=currentHash}catch{}
});

void setLanguage(activeLang,{exitFull:false});
</script>
