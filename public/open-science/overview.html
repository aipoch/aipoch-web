summary\">大家好，今天向大家介绍 AIPOCH 的科研工作台 Open-Science。我们的 slogan 是 Science, Open to All。我们专注 AI4Science，希望把专家的科研方法与 AI 的执行能力结合起来，帮助研究者完成具体研究，并留下可以检查和复用的结果。</p>\n<ul>\n <li>Open-Science是开源、模型自由的科研工作台。研究者可以按任务选择模型、方法和执行环境，保留自己的技术选择和科学判断。</li>\n <li>今天，我会用一项研究任务介绍工作台怎样使用，再谈专家和科研机构可以怎样参与合作。</li>\n</ul>\n<p>先从我们的出发点说起：专家积累的科研经验，怎样才能在具体任务中被用起来？</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>“模型自由”指选择模型、供应商与部署方式的自由，不代表无需模型，也不意味着第三方模型调用和算力免费。</p>\n[Sources]<br>公司与产品定义：用户提供的对外介绍。建筑素材：AIPOCH 2026 年中汇报。视觉参考：AIPOCH — Skill Infrastructure for Medical Research。\n</details>\n </aside>\n</section>\n\n<section class=\"slide\" data-page=\"02\" data-title=\"把科研经验变成可执行的科学能力\">\n <div class=\"kicker\">01 / ABOUT AIPOCH</div>\n <h2 class=\"section-title\">把科研经验，变成<span class=\"highlight-text\">可执行的科学能力</span></h2>\n <p class=\"mission-intro\">AIPOCH 是一家专注于 AI4Science 的科技公司。我们让 AI 的计算与推理能力，与人类专家长期积累的科研经验相互增强，将分散的知识、资源与工作流转化为可执行、可验证、可复用的科研能力。</p>\n <div class=\"mission-formula\">\n  <div class=\"formula-part\"><span class=\"label\">MACHINE INTELLIGENCE</span><div class=\"en-big\">AI Compute<br>& Reasoning</div><div class=\"cn\">计算 · 推理 · 执行</div></div><div class=\"formula-symbol\">×</div>\n  <div class=\"formula-part\"><span class=\"label\">HUMAN EXPERTISE</span><div class=\"en-big\">Human Research<br>Experience</div><div class=\"cn\">经验 · 方法 · 判断 · 专业边界</div></div><div class=\"formula-symbol\">→</div>\n  <div class=\"formula-part formula-result\"><span class=\"label\" style=\"color:#655b2b\">SCIENTIFIC CAPABILITY</span><div class=\"en-big\">知识可以执行，<br>经验可以复用。</div><div class=\"cn\">在真实研究中验证与改进</div></div>\n </div>\n <p class=\"summary\">让科研经验进入实际研究过程，加速科学发现。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看专家经验的价值，以及它怎样成为研究任务中可以使用的方法。</p>\n<ul>\n <li>一种方法什么时候适用、需要什么数据、结果怎样检查，往往需要专业经验判断。</li>\n <li>我们希望把这些要求整理成可执行的步骤，让AI完成工具调用和计算，研究者负责判断目标、方法和结论是否合理。</li>\n <li>专家的方法可以被重复使用，也可以结合新的任务反馈继续改进。</li>\n</ul>\n<p>要做到这一点，需要把方法接到文献、数据、工具和实际执行中。下面看这些环节有哪些衔接问题。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>用户提供的 AIPOCH 公司定义与年中汇报产品部分。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface\" data-page=\"03\" data-title=\"科研需要的不只是更强的模型\">\n <div class=\"kicker\">02 / THE RESEARCH GAP</div>\n <h2 class=\"section-title\">科研需要的，<br>不只是<span class=\"highlight-text\">更强的模型</span></h2>\n <p class=\"subtitle\">真实研究需要连接证据、方法、工具、计算环境与结果。</p>\n <div class=\"fragmented\">\n  <div class=\"fragment\"><div class=\"index\">01</div><h3>问题</h3><div class=\"en\">QUESTION</div><p class=\"gap-note\">研究目标<br>反复解释</p></div>\n  <div class=\"fragment\"><div class=\"index\">02</div><h3>证据</h3><div class=\"en\">EVIDENCE</div><p class=\"gap-note\">文献与数据<br>分散检索</p></div>\n  <div class=\"fragment\"><div class=\"index\">03</div><h3>方案</h3><div class=\"en\">METHOD</div><p class=\"gap-note\">专业方法<br>依赖经验</p></div>\n  <div class=\"fragment\"><div class=\"index\">04</div><h3>分析</h3><div class=\"en\">EXECUTION</div><p class=\"gap-note\">代码与环境<br>来回切换</p></div>\n  <div class=\"fragment\"><div class=\"index\">05</div><h3>验证</h3><div class=\"en\">VALIDATION</div><p class=\"gap-note\">过程与结果<br>难以对应</p></div>\n  <div class=\"fragment\"><div class=\"index\">06</div><h3>成果</h3><div class=\"en\">ARTIFACTS</div><p class=\"gap-note\">产物与记录<br>难以复用</p></div>\n </div>\n <p class=\"problem-foot\">当前的断点：<span style=\"color:#111\">上下文丢失、工具断裂、执行中断、来源不清</span></p>\n <p class=\"summary\">把割裂的工具连接起来，让研究可以连续进行。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看研究过程中容易断开的环节：问题、证据、方法、执行、验证和产物之间，怎样接起来。</p>\n<ul>\n <li>论文、数据、代码和图表分散在不同工具里时，研究者需要反复整理材料、补充上下文。</li>\n <li>即使得到一个答案，我们仍然要知道依据是什么、实际运行了什么，以及结果怎样产生。</li>\n <li>Open-Science把相关材料、执行过程和产物放在同一个项目中，帮助研究者接着已有工作继续。</li>\n</ul>\n<p>我们先用这段动图，看一下工作台的整体体验。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>用户确认的叙事方案；原参考稿的 Fragmented Research Workflow 结构。\n</details>\n </aside>\n</section>\n\n<section class=\"slide\" data-page=\"04\" data-title=\"从问题直接进入真实研究\">\n <div class=\"kicker\">03 / MEET OPEN-SCIENCE</div>\n <h2 class=\"section-title\">从问题，直接进入<span class=\"highlight-text\">真实研究</span></h2>\n <p class=\"subtitle\">连接 AI 模型、专业科研能力与真实研究流程。</p>\n <div class=\"content split wide-visual\">\n  <div class=\"overview-copy\"><p class=\"body-text\">Open-Science 是 AIPOCH 推出的开源、模型自由科研工作台。<br><br>自由选择工具，查看执行过程；对具备完整记录的产物版本，重新运行计算并比对结果。</p><div class=\"key-values\"><div class=\"key-value\"><b>开放</b><span>OPEN SOURCE</span></div><div class=\"key-value\"><b>自主选择</b><span>MODEL CHOICE</span></div><div class=\"key-value\"><b>过程透明</b><span>TRANSPARENT</span></div><div class=\"key-value\"><b>产物复现验证</b><span>RERUN &amp; COMPARE OUTPUTS</span></div></div></div>\n  <div><figure class=\"crop shot workbench-home full-gif\"><img alt=\"本机 Open-Science v1.2.1：真实研究会话中的 Notebook、工具调用、研究结论与图表产物\" src=\"/open-science/assets/1bd785ee750bd9c5.png\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><div class=\"shot-caption\"><span>OPEN-SCIENCE · ARTIFACT VERIFICATION</span><span>真实界面 · 点击放大</span></div><div class=\"product-rail\"><span>项目首页</span><span>研究产物</span><span>来源记录</span><span>复现验证</span></div></div>\n </div>\n <p class=\"summary\">把研究问题、专业能力和真实执行，放进同一个工作台。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一次研究在工作台中的整体体验，后面再分别展开具体功能。</p>\n<ul>\n <li><strong>研究入口：</strong> 已有论文和数据时，可以建立项目、加入材料并说明目标，让后续分析围绕同一项研究推进。</li>\n <li><strong>真实执行：</strong> 需要计算、查询或生成文件时，Agent可以调用工具，产出可以打开查看的图表、报告或其他文件。</li>\n <li><strong>结果检查：</strong> 想了解结果怎样产生时，可以查看来源；对捕获条件完整的产物版本，还可以重跑并比对输出。</li>\n</ul>\n<p>这个工作台也面向不同背景的参与者。下面看大家可以在这里扮演什么角色。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>右侧为 2026-11-12 在本机 Open-Science v1.2.1 中截取的真实研究执行画面，展示 Notebook、工具调用、研究结论、来源、生成文件与图表如何在同一工作区联动。该图用于说明产品工作方式，不代表客户案例或效果承诺。</p>\n<p>产物验证仅针对被捕获的特定版本，不承诺完整会话回放或科学结论正确。记录缺失的历史产物可能不可验证。</p>\n[Sources]<br>本机 Open-Science v1.2.1 实际研究执行与结果界面截图，2026-11-12。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">Open-Science v1.2.1 发布说明</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"面向全球科研的公共空间\">\n <div class=\"kicker\">04 / THE GLOBAL SCIENTIFIC COMMONS</div>\n <h2 class=\"section-title\">一个工作台，<br>也是一块<span class=\"highlight-text\">全球科研公共空间</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">以 Open-Science 为共同基础设施，<br>让不同领域的参与者在同一空间协作。</p><div class=\"commons-share\"><h3>社区共享的，不只是代码。</h3><p>代码 · 方法 · 能力包<br>工作流 · 验证记录 · 研究经验</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">5.5K</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub 关注度 · 资料快照 2026.11.11</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Open-Science 共享科研空间共建示意\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"圆形共享科研工作台中的四组参与者：左前方研究者分析数据，后方两人讨论方法，前方开发者编排工作流，右侧科研机构的三人实验组操作显微镜、移液器和样本。\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"选择四类共建角色，查看协作方式\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"研究者共建路径\">研究者</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"领域专家共建路径\">领域专家</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"开发者共建路径\">开发者</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"科研机构共建路径\">科研机构</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">点击角色，高亮对应小组，查看共建方式。</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">共建链路</span><span>使用能力</span><span class=\"cycle-arrow\">↔</span><span>交流问题</span><span class=\"cycle-arrow\">↔</span><span>检查方法</span><span class=\"cycle-arrow\">↔</span><span>贡献经验</span><span class=\"cycle-arrow\">↔</span><span>共同改进</span></p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这一页主要回答两个问题：谁在共同建设 Open-Science，大家可以贡献什么。</p>\n<ul>\n <li><strong>研究者：</strong> 带来真实问题和材料，让能力建设从实际科研需求出发。</li>\n <li><strong>领域专家：</strong> 提供方法、判断标准和适用边界，让专业经验能够被准确复用。</li>\n <li><strong>开发者与科研机构：</strong> 开发者接入工具和数据源，科研机构参与验证、协作与长期维护。</li>\n <li><strong>共享内容：</strong> 社区可以共享代码、Skill、工作流和验证记录。其他研究者能够直接复用，也能检查这些能力怎样工作。</li>\n <li><strong>社区关注度：</strong> 截至 2026 年 11 月 11 日，Open-Science GitHub 仓库获得 5.5K Stars。这个数字反映公开关注度，不等同于用户数或科研效果。</li>\n <li><strong>公开边界：</strong> 是否贡献、贡献哪些内容，都由参与者决定。使用产品不要求公开私人数据或未发表成果。</li>\n</ul>\n<p>接下来，我们不再停留在生态层面，而是用一个具体研究任务，看这些能力怎样接续起来。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>共建链路：使用能力 ↔ 交流问题 ↔ 检查方法 ↔ 贡献经验 ↔ 共同改进。点击四类角色可查看各自的共建方式。概念插画不代表实际办公空间、合作伙伴或在线协作界面。5.5K Stars 为 2026-11-11 GitHub 页面快照，展示项目关注度，不是用户数、贡献者数或全球排名。</p>\n[Sources]<br>四类共建角色及说明、社区共享对象与共建链路：用户明确提供。插画：AIPOCH 共享科研工作台概念图。关注度：Open-Science GitHub 仓库 2026-11-11 页面快照，5.5K Stars。<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub 仓库</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"六步研究旅程：从项目到打包分享\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">一个研究问题，走向<span class=\"highlight-text\">可检查的结果</span></h2>\n <p class=\"subtitle\">以论文结果复现为例，六个步骤接续同一项研究，最后完成验证、.science 打包与 Research film 讲解。</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">示例任务</span><p>我有论文和数据，想复现其中的关键结果。</p><span class=\"journey-hint\">点击步骤，跟随研究过程 →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"六步研究旅程：从建立项目到验证、打包与分享\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"第1步 建立研究项目\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">建立研究项目</span><span class=\"journey-capability\">研究项目与持续上下文</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"第2步 加载专业能力\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">加载专业能力</span><span class=\"journey-capability\">Specialist 与 Skill 生态</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"第3步 选择模型与环境\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">选择模型与环境</span><span class=\"journey-capability\">Agent · Model<br>Local · Remote · Runtime</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"第4步 确认计划并执行\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">确认计划并执行</span><span class=\"journey-capability\">科研执行与任务编排</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"第5步 查看研究产物并按需标注\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">查看研究产物</span><span class=\"journey-capability\">Artifact · 可选修改</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"第6步 验证后打包分享：复现验证后导出 .science 研究包\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">验证、打包与讲解</span><span class=\"journey-capability\">复现验证 · .science · Research film</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">先明确：这次要复现什么？</h3><p class=\"journey-detail-copy\">创建项目，写清复现目标；加入论文与数据，让后续讨论都接着已有材料继续。</p><p class=\"journey-result\"><span>本步得到</span>包含目标和材料的研究项目</p><button class=\"journey-next\" data-journey-to=\"1\">下一步：加载专业能力 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/4aa6aabf212801d6.png\" alt=\"本机 Open-Science v1.2.1 首页：项目、最近会话与研究记录\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>创建项目 · 确定目标与上下文 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">让专业能力进入这次研究。</h3><p class=\"journey-detail-copy\">选择适合任务的 Specialist，查找并加载 Skill，按需接入工具和数据。</p><p class=\"journey-result\"><span>本步得到</span>为当前任务加载的专业能力</p><button class=\"journey-next\" data-journey-to=\"2\">下一步：选择模型与环境 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/a221fc5a65f06ad2.png\" alt=\"本机 Open-Science v1.2.1 资源中心：已安装 Skills 与版本状态\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Skills · 查找并自主加载 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">决定用什么工具，在哪里运行。</h3><p class=\"journey-detail-copy\">选择模型与 Agent，配置 Python / R 环境；需要时连接 SSH、Slurm、Kubernetes、Hugging Face Jobs、Modal 或 Ray。</p><p class=\"journey-result\"><span>本步得到</span>本次研究的模型与运行环境</p><button class=\"journey-next\" data-journey-to=\"3\">下一步：确认计划并执行 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/dc5411da324ab7ee.png\" alt=\"本机 Open-Science v1.2.1 模型设置：当前模型、服务商与接入状态\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Model · 自主选择研究使用的模型 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">看过计划，再开始执行。</h3><p class=\"journey-detail-copy\">审阅计划与权限后，Agent 与 Sub-agents 分工执行，调用工具和代码；可查看进度、补充指导。</p><p class=\"journey-result\"><span>本步得到</span>运行记录、代码和中间结果</p><button class=\"journey-next\" data-journey-to=\"4\">下一步：查看研究产物 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/1bd785ee750bd9c5.png\" alt=\"本机 Open-Science v1.2.1 真实执行会话：Notebook、工具步骤与研究产物同屏\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>研究计划 · 审阅步骤后确认执行 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">查看结果；需要时，再标注修改。</h3><p class=\"journey-detail-copy\">图表、文本或 Notebook 可直接查看和交付；如需调整，可选中内容或标记图片位置，把修改要求交给 Agent。</p><p class=\"journey-result\"><span>本步得到</span>版本化产物与可选的定点修改入口</p><button class=\"journey-next\" data-journey-to=\"5\">下一步：产物复现验证 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0416666667\"><figure class=\"crop shot\" data-crop=\"artifactAnnotation|1120,590,980,480\" style=\"aspect-ratio:980/480\"><img src=\"/open-science/assets/4615fe26a153eaf7.png\" alt=\"本机 Open-Science v1.2.1 真实研究结果：结论、来源、生成文件与图表预览\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>产物预览 · 需要时标注并交给 Agent 修改 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">验证完成，再打包分享</h3><p class=\"journey-detail-copy\">先对已捕获的产物版本重跑并比对输出。随后导出 .science 研究包供只读检查，也可以从同一研究记录生成带旁白和字幕的 Research film。</p><p class=\"journey-result\"><span>本步得到</span>复现记录、.science 研究包与讲解短片</p><a class=\"journey-next\" href=\"#slide-13\">了解打包与分享：.science 研究包 →</a></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.783687943262411\"><figure class=\"crop shot\" data-crop=\"artifactVerification|1275,228,785,282\" style=\"aspect-ratio:785/282\"><img src=\"/open-science/assets/c40d244a46a6fa9f.png\" alt=\"本机 Open-Science v1.2.1 .science 会话包：必要证据、可选文件、版本与依赖\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Reproducibility · 人工示例验证通过 · 点击查看完整截图</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">项目上下文、文件与来源记录贯穿全程；验证后可导出 .science 研究包，也可生成 Research film 用于讲解。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一项研究的完整路径。这是一张总览地图，后面几页分别介绍支撑它的能力。</p>\n<ul>\n <li><strong>建立研究项目：</strong> 先明确想复现哪个结果，加入论文和数据，让目标与材料有统一位置。</li>\n <li><strong>加载专业能力：</strong> 任务需要特定方法时，选择合适的Skill或Specialist，让分析有明确的专业要求。</li>\n <li><strong>选择模型与环境：</strong> 根据任务需要选择模型、Agent和运行环境；远程任务可提交到 SSH、Slurm、Kubernetes、Hugging Face Jobs、Modal 或 Ray。</li>\n <li><strong>确认计划并执行：</strong> 复杂任务可以先确认思路，再调用工具运行；分工和额外审查按需启用。</li>\n <li><strong>查看研究产物：</strong> 检查图表、报告或Notebook，符合要求就可以直接使用；需要调整时才修改。</li>\n <li><strong>验证后打包分享：</strong> 对捕获条件完整的产物版本重跑并比对。确认结果后，导出 .science 研究包供对方只读查看，也可以生成 Research film 进行汇报；需要继续研究时，对方可以 Fork。</li>\n</ul>\n<p>这些能力可以按任务需要使用，不是每项研究都必须完成所有操作。先看研究跨越多次会话时，之前的工作怎样保留。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>示例任务为讲解用情境，不是客户引言或效果承诺。项目、Skills、模型与环境、执行过程、产物和来源追踪均使用 2026-11-12 本机 Open-Science v1.2.1 实际界面截图。各步骤用于说明一项研究如何衔接，不声称来自一次连续客户研究。</p>\n<p>本页复现验证、.science 打包、Research film 与远程计算说明更新到 v1.2.1。部分旅程截图沿用 v0.26.0（2026-09-07）资料快照。Desktop、Web、Mobile、CLI / Headless 的具体支持范围依端与环境而异。MedFlow 的专业工作流模块仍按后续页面的产品状态说明。</p>\n[Sources]<br>本机 Open-Science v1.2.1 项目、资源中心、设置、执行、产物与导出界面截图，2026-11-12。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：统一资源中心、Agent、CSV 与紧凑导出</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：远程计算与步骤讨论</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.1.0\" target=\"_blank\" rel=\"noopener\">v1.1.0：Research film 与文献工具</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"研究不会在一次对话结束\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">研究不会在<span class=\"highlight-text\">一次对话结束</span></h2>\n <p class=\"subtitle\">以项目组织研究，让上下文、材料与历史决策持续积累。</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"研究项目持续性功能\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>项目与会话持续保存</b><small>同一项目内积累讨论、文件与成果。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>项目上下文</b><small>让每个会话继承共同目标与研究约束。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-memory\"><span class=\"num\">03</span><span><b>长期研究记忆</b><small>按需启用，管理稳定偏好与研究背景。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">04</span><span><b>分支、Fork 与步骤讨论</b><small>保留原路径；从导入记录的具体步骤继续提问。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">05</span><span><b>全局搜索与会话引用</b><small>首页 Search / ⌘K / Ctrl+K；用 # 引用已有会话。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">06</span><span><b>Side chat：多标签页并行</b><small>多个独立标签页可与主会话同时运行。</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.3333333333333333\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/047e050350ef5ae1.png\" data-full-src=\"/open-science/assets/d331e9c96bfc9a9b.png\" alt=\"Open-Science v1.2.1: 项目与会话：已保存的讨论、生成文件与成果预览\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>项目会话与成果预览</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/a29ed25752359cc2.png\" data-full-src=\"/open-science/assets/7dc1ab115e3c9bf9.png\" alt=\"Open-Science v1.2.1: 项目设置中的 Agent Context，标注为未保存的填写示例\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Project Settings / Agent Context（未保存示例）</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-memory\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/587d2ad7a597c66f.png\" data-full-src=\"/open-science/assets/4ee334b24ff4ca29.png\" alt=\"Open-Science v1.2.1: Memory 设置中的新增记忆表单，未保存示例，当前记忆未启用\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Memory 填写入口（当前未启用，示例未保存）</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/bbb52356e4a705c6.png\" data-full-src=\"/open-science/assets/527d635ebb94603f.png\" alt=\"Open-Science v1.2.1: 当前会话操作菜单中的 Fork 入口，未创建新副本\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>会话操作菜单中的 Fork 入口</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/bdd5aeab13734042.png\" data-full-src=\"/open-science/assets/270c0d2c3129301c.png\" alt=\"Open-Science v1.2.1: 全局搜索 electricity 的真实结果，含项目、消息、会话与文献分类\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Global Search：关键词匹配已有项目与消息</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/dbad4a230cfc6342.png\" data-full-src=\"/open-science/assets/cad815b8eb78972e.png\" alt=\"Open-Science v1.2.1: 与主会话并列的 Side chat 独立输入面板，演示问题未发送\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Side chat 独立提问面板（草稿未发送）</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">每次研究都接着已有工作继续，不必反复解释同一段背景。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这一页主要讲研究怎样跨会话连续推进，以及不同研究路径怎样彼此分开。</p>\n<ul>\n <li><strong>项目与会话：</strong> 一项研究要分多次完成时，把讨论、文件和产物放在同一项目中。下次打开时，可以从已有工作继续。</li>\n <li><strong>项目上下文：</strong> 多个会话需要遵循同一目标和约束时，把共同背景写进项目，减少重复说明。</li>\n <li><strong>长期记忆：</strong> 研究偏好和稳定背景需要长期沿用时，可在 Memory 中添加条目，并按需启用记忆。当前截图展示未保存的填写示例，记忆开关保持关闭。时间敏感的信息仍需重新核验。</li>\n <li><strong>分支对话与 Fork：</strong> 想从同一点尝试另一种方法时，可以新建分支并保留原路径。导入 .science 研究包后，可以从具体步骤发起关联讨论；需要修改或执行时再 Fork 出可写副本。</li>\n <li><strong>侧边对话：</strong> 主任务推进时，如果只想追问统计方法或图表细节，可以打开独立侧聊。多个标签页可以同时运行，不会打断主会话。</li>\n <li><strong>全局搜索与会话引用：</strong> 需要找回过去的讨论、文件或产物时，可以统一搜索。新任务需要使用旧会话内容时，可以直接引用，不必手动复制整段记录。</li>\n</ul>\n<p>研究过程能够接续以后，下一页看外部文献怎样进入项目，并成为可以核查的证据。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>六张截图均来自 2026-11-12 本机 Open-Science v1.2.1：项目会话与成果、Project Settings / Agent Context、Memory 新增条目、Fork 菜单、全局搜索结果、Side chat 面板。项目上下文和 Memory 为明确标注的未保存示例，原设置未改动。Side chat 问题未发送。Fork 图展示操作入口，不代表已经创建副本或运行分支。页面聚焦功能区域，点击可查看完整原图。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：工作区与资源管理更新</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：步骤讨论与 Fork 入口</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface literature\" data-page=\"08\" data-title=\"从文献发现，到可提问、可追溯的证据\">\n <div class=\"kicker\">07 / LITERATURE REFERENCE LIBRARY</div>\n <h2 class=\"section-title\">从文献发现，到<span class=\"highlight-text\">可提问、可追溯的证据</span></h2>\n <p class=\"subtitle\">从 Zotero 或 PDF 导入文献；支持可恢复批量概览、CLI / MCP 管理、原文提问、图表提取与 bibliography.csv 导出。</p>\n <div class=\"content literature-interactive gallery\" data-gallery=\"literature\">\n  <div class=\"literature-tabs\" role=\"tablist\" aria-label=\"文献资料库功能\">\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"literature-library\"><span class=\"literature-num\">01</span><span><b>Zotero / PDF 导入</b><small>导入 Zotero 10+ 资料库或批量 PDF</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-reference\"><span class=\"literature-num\">02</span><span><b>记录、概览与笔记</b><small>元数据、可恢复批量概览与个人笔记检索</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-fulltext\"><span class=\"literature-num\">03</span><span><b>自动阅读与原文提问</b><small>按文档逻辑顺序读取，选中具体句子提问</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-figures\"><span class=\"literature-num\">04</span><span><b>图表提取与导出</b><small>提取结构、导出表格，供 Agent 读取</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-citation\"><span class=\"literature-num\">05</span><span><b>引用与完整性检查</b><small>引用导出；按需检查 DOI 撤稿与更正</small></span></button>\n  </div>\n  <div class=\"literature-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"literature-library\"><figure class=\"crop\" data-crop=\"literatureLibrary|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/869903d02b06e40e.png\" alt=\"本机 Open-Science v1.2.1 文献库：跨项目检索、筛选、评分、附件与去重\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>LIBRARY · 参考文献统一检索、筛选、评分与去重</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-reference\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureReference|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/5b89ac510774a579.png\" alt=\"本机 Open-Science v1.2.1 文献记录详情：DOI、作者、标签、附件与项目关联\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>RECORD · DOI、作者、标签、附件与项目关系</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-fulltext\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFullText|300,0,2260,1271\" style=\"aspect-ratio:2260/1271\"><img src=\"/open-science/assets/d772b86c009a2161.png\" alt=\"本机 Open-Science v1.2.1 PDF 阅读器：原文、图表、批注、翻译与 Read with agent\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>READ &amp; ASK · 高亮具体句子，在文献上下文中向 Agent 提问</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-figures\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFigures|160,134,1868,838\" style=\"aspect-ratio:1868/838\"><img src=\"/open-science/assets/4f88c0c16a89e35c.png\" alt=\"本机 Open-Science v1.2.1 Read with agent：选择项目并把文献带入研究会话\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>FIGURES &amp; TABLES · 图表提取、表格导出与 Agent 读取</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-citation\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureCitation|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/511f3bcdb66cc547.png\" alt=\"本机 Open-Science v1.2.1 引文样式：APA、MLA、Chicago、Vancouver、IEEE、Nature 与 AMA\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>CITATION STYLES · 本机 v1.2.1 真实界面</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">文献、个人笔记与提取图表共同进入研究，Agent 的回答仍可回到原文核查。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这一页主要看文献怎样从资料库进入研究，最后成为能提问、能引用、能回到原文核查的证据。</p>\n<ul>\n <li><strong>Zotero 与 PDF 导入：</strong> 已有 Zotero 10+ 资料库或一批 PDF 时，可以直接导入记录、附件、标签和收藏层级，减少重新整理。</li>\n <li><strong>批量概览与个人笔记：</strong> 文献较多时，可以批量生成论文概览；任务中断后从未完成部分恢复，不重复生成已完成结果。个人笔记仍可跨资料库检索。</li>\n <li><strong>自动阅读顺序：</strong> 面对多栏排版或结构复杂的 PDF，系统优先按文档逻辑顺序读取，帮助 Agent 获得更连贯的上下文。</li>\n <li><strong>高亮原文提问：</strong> 对某一句结论或方法有疑问时，可以选中原文直接提问。这样问题会明确指向具体证据，而不是泛泛地问整篇论文。</li>\n <li><strong>图表提取与导出：</strong> 需要进一步分析论文图表时，可以提取结构并导出表格，减少手工录入。提取结果仍要对照原文检查。</li>\n <li><strong>CLI / MCP 与 CSV：</strong> 文献资料库可以通过命令行或 MCP 客户端检索和维护记录；v1.2.1 可将选中文献导出为 bibliography.csv，并保留 DOI、标签、笔记与完整性状态。</li>\n</ul>\n<p>文献证据准备好以后，下一页进入技术配置，决定由什么 Agent 执行，以及在哪里运行。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>提取结果与 Agent 的回答仍需对照原文核查，不保证每张图表都能完整、准确提取。撤稿与更正检查由用户手动发起，依赖 Crossref 元数据，不能保证覆盖全部问题。全文可用性取决于来源、许可与网络环境。</p>\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.3\" target=\"_blank\" rel=\"noopener\">v1.0.3：文献发现、补充材料、Smart Screening 与 PDF 工作流</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.4\" target=\"_blank\" rel=\"noopener\">v1.0.4：DOI 撤稿与更正检查</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.5\" target=\"_blank\" rel=\"noopener\">v1.0.5：阅读状态与筛选</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.6\" target=\"_blank\" rel=\"noopener\">v1.0.6：Zotero 导入、个人笔记检索与自动 PDF 阅读顺序</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.1.0\" target=\"_blank\" rel=\"noopener\">v1.1.0：文献 CLI / MCP 与可恢复批量概览</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：固定版式 PDF 翻译的容错改进</a><br>文献库、PDF 阅读、Read with agent 与引文样式均为 2026-11-12 本机 Open-Science v1.2.1 实际界面截图。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：文献与 bibliography.csv 更新</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"09\" data-title=\"把技术选择权留给研究者\">\n <div class=\"kicker\">08 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">模型、Agent、算力和环境，<span class=\"highlight-text\">由你决定</span></h2>\n <p class=\"subtitle\">围绕研究任务选择工具，不必围绕某个工具改变研究方式。</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Agent 自由</h3><p>默认 Open-Science Agent；支持 Codex 订阅、Claude Fable 5.2、OpenCode、CodeBuddy、Pi。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>模型自由</h3><p>多家服务商、兼容端点和 Claude / Codex 订阅登录。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>算力自由</h3><p>本地、SSH / Slurm，或 Kubernetes、HF Jobs、Modal、Ray。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>环境自由</h3><p>Python / R / REPL，持久 Kernel、环境修复与网络保护。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>数据自由</h3><p>48 个内置 Connector，也支持官方 API 与自定义 MCP。</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"技术选择截图\"><button role=\"tab\" aria-selected=\"true\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackAgent|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/f4722a17f0de62df.png\" alt=\"本机 Open-Science v1.2.1 Agent 设置：Open-Science Agent、Claude Agent、OpenCode 与 Codex\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackModel|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/dc5411da324ab7ee.png\" alt=\"本机 Open-Science v1.2.1 模型设置：当前模型、服务商与连接状态\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackCompute|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/ca2c04e5a04689b0.png\" alt=\"本机 Open-Science v1.2.1 Compute：SSH、Hugging Face Jobs、Modal、Kubernetes 与 Ray\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackRuntime|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/330610a8f735bb5c.png\" alt=\"本机 Open-Science v1.2.1 Runtimes：Notebook 环境、Python 与网络保护\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackConnectors|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/43dc5bd00178ec89.png\" alt=\"本机 Open-Science v1.2.1 Connectors：48 个已安装连接器与统一管理入口\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n </div><div class=\"shot-caption\"><span>CHOOSE YOUR STACK</span><span>点击标签切换真实截图</span></div><p class=\"small-note\">选择第三方模型、远程服务或数据连接器时，数据传输与费用取决于所选服务及配置。</p></div></div>\n <p class=\"summary\">技术组合可以更换，研究目标与选择权始终属于研究者。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这一页主要看研究的运行底座。研究者可以按任务选择 Agent、模型、算力和环境，不需要预先固定整套技术。</p>\n<ul>\n <li><strong>Agent 框架：</strong> 新安装默认使用内置 Open-Science Agent；v1.2.1 增加 Codex 订阅登录、Claude Fable 5.2 与明确的输出上限，同时保留其他 Agent 选项。</li>\n <li><strong>模型服务：</strong> 不同任务对能力、成本和账号有不同要求时，可以切换模型服务、兼容端点或订阅登录，避免绑定单一模型。</li>\n <li><strong>算力与 Runtime：</strong> 小任务可以本地运行。计算量较大时，可以连接 SSH、Slurm、Kubernetes、Hugging Face Jobs、Modal 或 Ray。远程提交会先确认目标、命令、资源和输出，重启后可恢复结果收集。</li>\n <li><strong>Connector 与 MCP：</strong> 任务需要科研数据库、官方源 API 或已有工具时，可以按需接入，不必把全部资源同时开放给 Agent。</li>\n <li><strong>数据边界：</strong> 选择云端模型或第三方服务时，数据传输、费用和服务政策取决于具体配置。研究者需要在使用前确认这些边界。</li>\n</ul>\n<p>这一页解决的是技术选择。下一页解决专业方法，也就是任务应该按照什么步骤和标准来做。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>使用云端模型、远程端点或第三方连接器时，相关请求可能发送给所选服务。本地优先不等于任何配置下数据都不会离开设备，费用及数据政策取决于所选服务。</p>\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.0\" target=\"_blank\" rel=\"noopener\">v1.0.0：四种 Agent、模型、Runtime、Compute 与科研连接能力</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.4\" target=\"_blank\" rel=\"noopener\">v1.0.4：独立 CLI MCP 与 GitHub Skills 导入</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.6\" target=\"_blank\" rel=\"noopener\">v1.0.6：自定义 stdio Connector 的 Node / npm 运行支持</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：内置 Open-Science Agent 与云端计算后端</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">当前 README：48 个内置 Connectors 与 Agent / Model 选项</a><br>Agent、Model、Compute、Runtimes 与 Connectors 均为 2026-11-12 本机 Open-Science v1.2.1 实际界面截图。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：Agent、云登录与输出上限</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"10\" data-title=\"全球科研能力，按需加载\">\n <div class=\"kicker\">09 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">全球科研能力，<span class=\"highlight-text\">按需加载</span></h2>\n <p class=\"subtitle\">统一资源中心集中管理 Skills、Connectors、Specialists 与 Use Cases；安装与 Marketplace 浏览保持同一上下文。</p>\n <div class=\"content\"><div class=\"gallery marketplace-gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Skills 与 Specialists 市场功能\"><button role=\"tab\" aria-selected=\"true\" data-select=\"discover\">发现</button><button role=\"tab\" aria-selected=\"false\" data-select=\"install\">安装</button><button role=\"tab\" aria-selected=\"false\" data-select=\"batch\">批量安装</button><button role=\"tab\" aria-selected=\"false\" data-select=\"updates\">更新</button><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"false\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"discover\" role=\"tabpanel\" style=\"--market-shot-ratio:2.85714\"><figure class=\"crop\" data-crop=\"marketplaceDiscover|216,90,1400,490\" style=\"aspect-ratio:1400/490\"><img src=\"/open-science/assets/38472675cd5635c0.png\" alt=\"本机 Open-Science v1.2.1 Skills Marketplace：搜索、筛选、来源与安装状态\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">搜索与分类筛选，找到适合任务的 Skill · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"install\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceInstall|506,96,840,390\" style=\"aspect-ratio:840/390\"><img src=\"/open-science/assets/a221fc5a65f06ad2.png\" alt=\"本机 Open-Science v1.2.1 已安装 Skills：来源、版本与更新状态\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">查看版本与来源，再按需安装 · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"batch\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceBatch|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/38472675cd5635c0.png\" alt=\"本机 Open-Science v1.2.1 Skills Marketplace：能力条目与安装入口\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">多选 Skill，统一确认安装 · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"updates\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceUpdates|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/a221fc5a65f06ad2.png\" alt=\"本机 Open-Science v1.2.1 已安装 Skills 与版本状态\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">检查待更新版本，确认后更新；当前无待更新 · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\" style=\"--market-shot-ratio:1.90698\"><figure class=\"crop specialist-shot\" data-crop=\"marketplaceSpecialists|506,98,820,430\" style=\"aspect-ratio:820/430\"><img src=\"/open-science/assets/dbb5cd06c984f89d.png\" alt=\"本机 Open-Science v1.2.1 Specialists：已安装专家能力与版本信息\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">按专业任务浏览与安装 Specialist · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"skills\" role=\"tabpanel\" style=\"--market-shot-ratio:1.71429\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/38472675cd5635c0.png\" alt=\"本机 Open-Science v1.2.1 Skills Marketplace：发现、安装和复用科研方法\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">按需加载、创建或导入自己的 Skill · 点击放大</p></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>当前能力目录：</b>24 个内置 Skills、525 个 Marketplace Skills、10 个 Specialists 与 48 个内置 Connectors。</span></p><p><span>02</span><span class=\"skill-copy\"><b>自由加载、创建与复用：</b>自然语言创建、从 GitHub 导入；也可从首页案例库导入已验证研究包。</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN SKILL MARKETPLACE · USE & CONTRIBUTE</span></div><p class=\"resource-snapshot\">GitHub Stars 快照 · 2026.11.02</p>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">55.7K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · 多学科科研与分析</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">187K ★ ↗</span></div><p class=\"source-desc\">Anthropic 官方 Agent Skills · 文档、设计与开发工作流</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">3.4K ★ ↗</span></div><p class=\"source-desc\">Science Skills · 基因组学、结构生物学与检索</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-logo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills 项目标识\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">51.7K ★ ↗</span></div><p class=\"source-desc\">科研检索、写作、绘图、审稿与研究记录</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">503 ★ ↗</span></div><p class=\"source-desc\">生命科学 Agent Toolkit · 蛋白、分子与基因组</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>YOUR SKILL → MARKETPLACE</b><p>经审核后发布，让全球研究者加载、验证、复用与共同改进。</p></div></div>\n </div>\n </div>\n <p class=\"summary\">按需发现、安装与更新科研能力，也可将自己的方法贡献给社区。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">上一页解决“用什么技术运行”，这一页解决“按什么专业方法完成任务”。</p>\n<ul>\n <li><strong>Skill：</strong> 任务需要一套明确操作步骤时，可以加载 Skill。它把方法、工具调用和检查要求放在一起，减少重复说明和步骤遗漏。</li>\n <li><strong>Specialist：</strong> 任务需要某类专业角色统筹方法时，可以选择相应 Specialist，让计划和执行遵循该角色的专业要求。</li>\n <li><strong>统一资源中心：</strong> Skills、Connectors、Specialists 与 Use Cases 共享入口、筛选与详情面板；v1.2.1 支持 Web 端安装 Specialist，并保留搜索、分页和滚动位置。</li>\n <li><strong>研究案例库：</strong> 想从一个已经公开验证的流程开始时，可以查看首页案例并导入研究包，再换成自己的材料继续研究。</li>\n <li><strong>创建与导入：</strong> 专家已有成熟方法时，可以用自然语言整理成 Skill，或者从 GitHub 导入。这样方法可以反复测试和逐步改进。</li>\n <li><strong>右侧开源项目：</strong> 这些仓库展示了社区中可以接入的能力来源。Stars 只表示关注度，不代表方法质量或适合所有任务。</li>\n</ul>\n<p>技术和专业方法都准备好以后，下一页看任务真正运行时怎样规划、分工和检查。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>Skills、Marketplace、Specialists 与 Connectors 均为 2026-11-12 本机 Open-Science v1.2.1 实际界面截图。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：统一资源中心</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">当前 README：24 个内置 Skills、525 个 Marketplace Skills、10 个 Specialists 与 48 个 Connectors</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.4\" target=\"_blank\" rel=\"noopener\">v1.0.4：从 GitHub 导入 Skills</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.5\" target=\"_blank\" rel=\"noopener\">v1.0.5：首页研究案例库与已验证研究包</a><br><a href=\"https://github.com/aipoch/openscience-skill-marketplace\" target=\"_blank\" rel=\"noopener\">Skills Marketplace</a><br><a href=\"https://github.com/aipoch/openscience-specialist-marketplace\" target=\"_blank\" rel=\"noopener\">Specialist Marketplace</a><br>Stars 来源：各 GitHub 仓库公开页面，以下各项目为 2026.11.02 页面快照。<br><a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense Scientific Agent Skills</a><br><a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a><br><a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a><br><a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a><br><a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"11\" data-title=\"从科研能力，到真实研究执行\">\n <div class=\"kicker\">10 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">从科研能力，<span class=\"highlight-text\">到真实研究执行</span></h2>\n <p class=\"subtitle\">本地与远程任务按批准范围执行；长任务可在后台运行，远程作业重启后可恢复结果收集。</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"真实研究执行的四个能力演示\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>定义任务，按需规划</b><small>需要 Plan 时，研究者确认</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>按需委派，并行分工</b><small>按任务需要开启 Delegation</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>工具、后台与远程作业</b><small>审批目标、资源与输出；重启后恢复收集</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>按需启用 Reviewer</b><small>检查当前轮次的记录与证据</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK &amp; PLANNING</strong><span>发送前选择 Plan first，先规划再执行</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/fe15b6afd5265d52.png\" src=\"/open-science/assets/38065007e7bdc467.png\" alt=\"本机 Open-Science v1.2.1：发送菜单中的 Plan first 入口，演示草稿未发送\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>PLAN FIRST · LOCAL v1.2.1</span><span>Plan first 入口 · 演示草稿未发送</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / OPTIONAL DELEGATION</strong><span>按任务需要开启 Session 级 Delegation</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/77500b590198b638.png\" src=\"/open-science/assets/8005fae187dc7e05.png\" alt=\"本机 Open-Science v1.2.1：Agent controls 菜单中的会话级 Delegation 开关\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>AGENT CONTROLS · DELEGATION</span><span>会话级分工开关 · 按需开启</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / TOOLS &amp; BACKGROUND EXECUTION</strong><span>展开已完成工具步骤，查看 Notebook 代码</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/4740847d26e7d369.png\" src=\"/open-science/assets/1de90ff3593c227e.png\" alt=\"本机 Open-Science v1.2.1：展开已完成的 Notebook 工具步骤，查看实际运行代码\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · ACTUAL EXECUTION RECORD</span><span>实际执行记录 · 展开检查代码</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / OPTIONAL REVIEWER</strong><span>按需启用检查，专业判断由研究者负责</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" style=\"aspect-ratio:16/9\"><img data-full-src=\"/open-science/assets/d291b7ff8a05f310.png\" src=\"/open-science/assets/3abc34b0dec54a9e.png\" alt=\"本机 Open-Science v1.2.1：输入框加号菜单中的 Request review 入口，未发起检查\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>REQUEST REVIEW · CONVERSATION ACTIONS</span><span>输入框 + 菜单 · Request review 入口</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">研究者控制方向，Agent 调用真实工具执行。任务分工与 Reviewer 检查均按需启用。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这一页主要看任务开始以后，研究者怎样确认方向、安排分工、等待长任务并增加检查。</p>\n<ul>\n <li><strong>Plan：</strong> 任务复杂或交付要求明确时，可以先查看计划，再决定是否执行。简单任务不需要强制经过这一环节。</li>\n <li><strong>Delegation：</strong> 工作可以拆成相对独立的部分时，可以按需交给 Sub-agents 并行处理，由主 Agent 汇总结果。是否启用由任务决定。</li>\n <li><strong>真实工具执行：</strong> 需要计算、查询或生成文件时，Agent 会调用实际工具，把研究要求落实为代码、运行记录和产物。</li>\n <li><strong>后台与远程任务：</strong> 支持的任务可以在后台运行。Kubernetes、Hugging Face Jobs、Modal 与 Ray 会在提交前确认目标、命令、资源和输出；应用重启后可恢复结果收集。</li>\n <li><strong>Reviewer：</strong> 希望额外检查方法、依据或结论表达时，可以按需启用 Reviewer。它帮助发现需要核查的问题，不能代替研究者的科学判断或复现验证。</li>\n</ul>\n<p>任务执行完成以后，下一页看材料、产物和生成依据怎样一起管理并交给合作方。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.27.0\" target=\"_blank\" rel=\"noopener\">v0.27.0：后台长任务与结果自动回传</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.6\" target=\"_blank\" rel=\"noopener\">v1.0.6：开放中的长轮次保持产物发布能力</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：Kubernetes、Hugging Face Jobs、Modal 与 Ray 作业</a><br>本页四张截图分别为 2026-11-12 本机 Open-Science v1.2.1 的 Plan first 发送入口、Delegation 开关、已完成 Notebook 步骤和 Request review 入口。页面放大显示功能区域，点击可查看完整截图。Plan 演示草稿未发送；未发起新的研究任务或 Reviewer 检查；Delegation 展示开关入口，不表示已运行五个子任务。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"12\" data-title=\"材料与结果集中管理，全过程可追溯\">\n <div class=\"kicker\">11 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">研究材料与结果集中管理，<br>全过程<span class=\"highlight-text\">可检查、可追溯</span></h2>\n <p class=\"subtitle\">材料、产物版本与执行记录保持关联；研究者可以在同一工作空间查看、修改和核查。</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"材料、产物、来源与控制的四项能力\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS｜材料管理</b><small>项目文件、单文件最高 10 GiB 附件与 @ / # 引用。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS｜编辑与版本管理</b><small>文本可直接编辑、另存新版本并对比；图片可选标注修改。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE｜来源追踪</b><small>关联输入、代码、运行环境与可用执行记录。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL｜操作控制</b><small>按域名设置 Notebook 与 Connector 网络边界。</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / REFERENCES &amp; FILES</strong><span>上传、集中管理并在研究中引用</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceMaterials|0,500,2113,780\" style=\"aspect-ratio:2113/780\"><img src=\"/open-science/assets/a7178411fafa9747.png\" alt=\"本机 Open-Science v1.2.1 Files：集中查看上传材料和生成文件\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / EDIT · SAVE A NEW VERSION · COMPARE</strong><span>修改并非必需；保存新版本，原版本仍可查看</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"textCompare|84,63,1494,382\" style=\"aspect-ratio:1494/382\"><img src=\"/open-science/assets/22ced33ceef0ce74.png\" alt=\"本机 Open-Science v1.2.1 产物版本：查看 v2、切换版本并比较来源版本\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>TEXT VERSION · v1 → v2 · SYNTHETIC DEMO</span><div class=\"evidence-example-links\"><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/22ced33ceef0ce74.png\" alt=\"本机 Open-Science v1.2.1 Markdown 产物：预览、编辑、比较与下载\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"><figcaption>查看文本编辑 ↗</figcaption></figure><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/4615fe26a153eaf7.png\" alt=\"本机 Open-Science v1.2.1 图片产物：研究结论与图表预览同屏检查\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"><figcaption>图片标注（可选）↗</figcaption></figure></div></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>从产物回到代码、工具调用和运行环境</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceProvenance|1480,0,1080,720\" style=\"aspect-ratio:1080/720\"><img src=\"/open-science/assets/1bd785ee750bd9c5.png\" alt=\"本机 Open-Science v1.2.1 执行记录：Notebook、工具调用、输入输出与生成产物\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>运行过程持续保留</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>研究者定义 Notebook 与 Connector 的网络边界</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceControl|580,250,1400,950\" style=\"aspect-ratio:1400/950\"><img src=\"/open-science/assets/330610a8f735bb5c.png\" alt=\"本机 Open-Science v1.2.1 Runtimes：Notebook 环境与网络保护设置\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · CONNECTORS · DOMAIN RULES</span><span>受控访问 · 网络保护</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">结果可以直接查看和交付；需要调整时再修改，并保留版本与生成依据。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这一页主要看研究结果怎样交付和被检查。重点包括版本、生成依据和后续研究路径。</p>\n<ul>\n <li><strong>材料管理：</strong> 输入文件和生成文件较多时，可以在项目中集中查看，并通过 @ 或 # 引用，减少材料散落和版本混淆。</li>\n <li><strong>产物查看与可选修改：</strong> 图表、报告或 Notebook 符合要求时可以直接下载和交付。需要调整时，才编辑文本、保存新版本或标记图片位置。</li>\n <li><strong>版本对比：</strong> 修改过产物后，可以查看前后版本的差异，确认具体改了什么，同时保留原版本。</li>\n <li><strong>Provenance、来源预览与 RO-Crate：</strong> 需要核查产物怎样生成时，可以查看代码、输入、执行记录和环境信息。悬停批准的 HTTPS 来源链接可预览目标域名与元数据；验证产物还可导出 RO-Crate。</li>\n <li><strong>复现验证：</strong> 捕获条件完整时，可以针对某个产物版本重跑并比对输出。验证通过说明这次计算结果能够重现，不代表科学结论已经成立。</li>\n <li><strong>权限与网络控制：</strong> 使用敏感材料或外部服务时，可以检查审批请求和网络规则，明确 Agent 能访问什么。</li>\n</ul>\n<p>材料和产物能够被检查以后，下一页专门看 .science 研究包怎样把成果与形成过程一起交给合作方。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>本页文本编辑与 Compare 截图来自 2026-09-17 本地 v0.30.2 的合成 Markdown 演示：上传演示文本后直接编辑并保存，确认生成 v2、保留 v1，且可查看新增说明。截图并不声称该文本由 Agent 生成，也不表示科学发现。研究包截图来自本地合成产物验证会话的导出选项窗口，仅展示导出内容选择，不代表本次另行完成跨机器导入或验证。</p>\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.25.0\" target=\"_blank\" rel=\"noopener\">v0.25.0：文本源编辑、保存新版本与 Compare</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.32.0\" target=\"_blank\" rel=\"noopener\">v0.32.0：验证产物的完整 RO-Crate 导出</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：来源链接预览与只读导入记录的步骤讨论</a><br><a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">PR #1815：可选 Annotation</a><br>本地白色界面实拍：文本编辑、v2 对比及研究包导出选项（2026-09-17）；保留此前用户提供的 Files、Annotation、Execution Log 与 Network 截图。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface science-package\" data-page=\"13\" data-title=\".science 研究包：成果与过程一起交付\">\n <div class=\"kicker\">12 / PORTABLE RESEARCH PACKAGE</div>\n <h2 class=\"section-title\"><span class=\"highlight-text\">.science 研究包</span>：把成果与形成过程一起交付</h2>\n <p class=\"subtitle\">选择会话路径、文件版本与证据，导出更紧凑的 .science 记录；导入后可从具体步骤提问，需要执行或修改时再 Fork。</p>\n <div class=\"science-package-layout\" data-science-package-layout>\n  <div class=\"science-package-steps\" aria-label=\".science 研究包的使用流程\">\n   <div class=\"science-package-step\" aria-selected=\"true\"><span class=\"sp-num\">01</span><span><b>会话分支</b><small>保留研究问题、分析选择与探索路径</small></span></div>\n   <div class=\"science-package-step\" aria-selected=\"false\"><span class=\"sp-num\">02</span><span><b>选定文件</b><small>带上需要共享的材料、结果与文件版本</small></span></div>\n   <div class=\"science-package-step\" aria-selected=\"false\"><span class=\"sp-num\">03</span><span><b>证据记录</b><small>留下已有来源、引用与相关执行记录</small></span></div>\n   <div class=\"science-package-step\" aria-selected=\"false\"><span class=\"sp-num\">04</span><span><b>导出、导入与讨论</b><small>只读查看；从具体步骤提问或 Fork 继续</small></span></div>\n  </div>\n  <div class=\"science-package-stage\">\n   <iframe class=\"science-code-frame\" data-science-code-frame allowtransparency=\"true\" title=\".science 研究包代码动画：会话分支、选定文件和证据记录组成一个可携带的研究包\"></iframe><div class=\"science-v121-flow\" aria-label=\"v1.2.1 研究包流转\"><span><b>01 · EXPORT</b>紧凑导出</span><span><b>02 · IMPORT</b>只读回放</span><span><b>03 · DISCUSS</b>从步骤提问</span><span><b>04 · FORK</b>需要执行再继续</span></div>\n  </div>\n </div>\n <div class=\"summary\"><i></i><span>导入记录保持只读；步骤讨论不会改写原包。需要执行或修改时，再 Fork 到可写路径。</span></div>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要看 .science 研究包与普通研究报告的区别：它不只交付结论，还把形成结论时选定的研究路径、材料和证据记录一起带走。</p>\n<ul>\n <li><strong>会话分支：</strong> 使用场景是需要让导师或合作者理解“为什么采用这条分析路径”。它的价值是保留关键选择和探索过程，避免交接时只剩最终答案。</li>\n <li><strong>选定文件：</strong> 使用场景是一次研究产生了很多输入、结果和中间文件，但只想交付与当前结论有关的部分。它的价值是让材料范围清楚，减少缺文件和版本混淆。</li>\n <li><strong>证据记录：</strong> 使用场景是接收者需要核对结论来自哪些来源、引用或执行记录。它的价值是让关键判断有依据可查，而不是只看到一张结果图。</li>\n <li><strong>导出 .science 研究包：</strong> 在会话的导出入口选择 Essential、Full 或自定义内容，生成一个可携带的 .science 文件。分享前仍要检查敏感数据和凭据。</li>\n <li><strong>接收、步骤讨论与继续：</strong> 对方先只读查看研究路径、文件和证据。对某一步有疑问时，可以发起与该步骤关联的子讨论；需要执行或修改时，再 Fork 出可写路径，原始记录保持不变。</li>\n <li><strong>边界：</strong> 研究包解决的是研究交接与审阅，不会自动执行代码，也不等同于产物复现验证。复现验证仍需要完整捕获环境与输入后重新运行。</li>\n</ul>\n<p>这一页讲清研究记录怎样交接以后，下一页看同一份记录如何生成可观看的讲解短片。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>右侧动画直接嵌入用户提供的《交大医学院工作坊_2026-11-04》中的 HTML、SVG 与 JavaScript 动画代码，并按产品介绍版版式缩放；不是截图、GIF 或录屏。动画代码来自工作坊原稿；产品功能边界更新到 Open-Science v1.2.1。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：更紧凑的研究包导出</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0：导入研究的步骤讨论与 Fork 入口</a></p>\n</details>\n </aside>\n</section>\n<template id=\"science-package-animation-template\"><style>\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F7F7F4;font-family:Arial,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n.slide{position:relative;width:100%;height:100%;overflow:hidden;background:#F7F7F4}\n.science-story-page{position:absolute;inset:0;overflow:hidden;background:#F7F7F4;color:#111210}\n.science-story-page>*{display:none!important}\n.science-story-page .ss-hairline-stage{display:block!important;position:absolute;left:7%!important;top:15px!important;width:86%!important;height:430px!important;transform:translateY(-75px) scale(.84);transform-origin:50% 50%;pointer-events:auto}\n.science-story-page .ss-hairline-host{position:absolute;inset:0;pointer-events:auto;--hairline-plate:#f4f1ec;--hairline-hi:#d1a628;--hairline-edge:#292a23;--hairline-mid:#7e786c;--hairline-lo:#aaa08e;--hairline-stroke:1.35}\n.science-story-page .ss-hairline-host svg{overflow:visible;pointer-events:auto}\n.science-story-page .ss-point-label,.science-story-page .ss-package-label,.science-story-page .ss-file-mark{display:none!important}\n.science-story-page .ss-cover-brand{fill:#4d483d;stroke:none;font-family:Arial,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n</style><div class=\"slide active\" data-slide=\"2.8\"></div><script>/* hairline kernel sha256:346b48bdef2cdfafd5343eba01494255cf75f9c078e6fcd1aafc62bab62980a1 */\n/*\n * HL: everything a figure may call. Read this index; the code under it is the\n * package's src/core, unchanged, and a figure should not need to read it.\n *\n * Every figure is drawn in a 400 × 320 viewBox. World space is x/y on the\n * ground and z up. Plates are filled with the ground colour and painted back\n * to front, so a nearer one covers a farther one: append in that order. At\n * the default camera, Cam(45, 0.5, S), +x runs down to the right and +y down\n * to the left, so the corner with the largest x and y is nearest the viewer:\n * append by ascending x + y, from the far corner (smallest x and y) to it.\n *\n * Camera\n *   Cam(azDeg, k, S)                       a camera: azimuth in degrees, k = sin(elevation) (0.5 is the 2:1 view), S = scale\n *   fit(C, points, cx, cy)                 centres the box of [x, y, z] points on (cx, cy); call it once, before proj\n *                                          it only centres, it never scales: choose S by trying values, with the most extreme pose in points.\n *                                          The six figures use S 1.42 to 2.12; the boxes they fit come out 230 to 310 wide and 180 to 245 tall\n *   proj(C)                                returns P(x, y, z), which gives [sx, sy]\n *   unproj(C, sx, sy, z)                   the world [x, y] under a screen point, on the plane at height z\n *   facing(C)                              returns front(sample): whether a ring sample faces the camera\n * Rounded solids\n *   rrect(u0, v0, u1, v1, r, n)            a rounded rectangle, as a ring of samples {u, v, nu, nv}\n *   circ(R, n)                             a circle, as a ring\n *   rings(x0, y0, x1, y1, r, b)            [ring, inner]: a rounded footprint and its crease ring, inset by b\n *                                          r, the corner radius, is cut to half the shorter side. b, the crease's inset in world units\n *                                          (0.6 to 2.2 in the figures), must stay under half the shorter side or the crease turns inside out\n *   prism(P, front, ring, inner, z0, z1)   {sil, crease}: a solid standing from z0 to z1, as two path strings\n *   ringAt(P, ring, z)                     the ring's points, projected at height z\n *   run(ring, keep)                        the one cyclic run of samples that pass keep\n *   hull(points)                           the convex hull of screen points\n *   extremes(P, ring)                      [left, right, nearest] samples: where dashed drops fall from\n *   fillet(points, radii, n)               rounds every vertex of a closed polygon; returns the new points\n *                                          radii is an array, one radius per vertex, each cut to half its shorter edge; a single number gives NaN.\n *                                          n is the steps round each corner, default 4: each vertex becomes n + 1 points\n *   ghost(P, front, ring, z0, depth)       a reflection's path {d, y0, y1}; reflect() draws it for you\n * Paths and numbers\n *   poly(points)
