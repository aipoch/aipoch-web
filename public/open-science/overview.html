f-num\">02</span><span><b>自动生成讲解</b><small>编写分镜和动画，生成英文旁白与字幕</small></span></div>\n   <div class=\"research-film-step\"><span class=\"rf-num\">03</span><span><b>先查看便携版</b><small>保存独立 HTML 播放器与源文件 ZIP</small></span></div>\n   <div class=\"research-film-step\"><span class=\"rf-num\">04</span><span><b>按需导出 MP4</b><small>Desktop 另存 1280 × 720、16:9 视频</small></span></div>\n  </div>\n  <div class=\"research-film-visual\">\n   <div class=\"research-film-demo\">\n    <video controls playsinline preload=\"metadata\" poster=\"/open-science/assets/5af59e07c9e7f8b5.png\" onkeydown=\"event.stopPropagation()\" aria-label=\"Can We Reproduce Chinchilla Scaling 研究短片\">\n     <source src=\"/open-science/assets/f25b88730c7cd12a.mp4\" type=\"video/mp4\">\n    </video>\n   </div>\n   <div class=\"research-film-caption\"><strong>CAN WE REPRODUCE CHINCHILLA SCALING?</strong><span>4K · 2:10 · <a href=\"/open-science/assets/f25b88730c7cd12a.mp4\" target=\"_blank\" rel=\"noopener\">打开视频 ↗</a></span></div>\n  </div>\n </div>\n <div class=\"summary\"><i></i><span>适合汇报、交接与异步审阅；研究短片是解释层，不替代 .science 研究包、来源证据和复现验证。</span></div>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要看 .science 研究记录怎样进一步变成可观看、可讲解的 Research film。它解决的不是研究如何执行，而是研究完成以后怎样更容易汇报、交接和异步审阅。</p>\n<ul>\n <li><strong>选择研究路径：</strong> 使用场景是一个项目里有多条探索分支，只想讲清其中一条已完成路径。使用方法是在已完成会话或导入记录的操作菜单中选择 <strong>Generate research film</strong>。它的价值是固定选中的分支和可用图片，让短片对应一条明确的研究记录。</li>\n <li><strong>自动生成讲解：</strong> 使用场景是需要把较长的研究会话整理成可观看的说明。系统根据冻结的记录编写分镜与动画脚本，生成英文旁白并对齐字幕；生成可以在后台继续。它的价值是减少人工剪辑和逐页录屏。</li>\n <li><strong>便携播放器：</strong> 使用场景是需要把结果交给没有打开原会话的人查看。默认输出可独立打开的 HTML 播放器与源文件 ZIP。它的价值是保留旁白、字幕、动画和引用图片，便于离线播放与后续归档。</li>\n <li><strong>MP4 导出：</strong> 使用场景是需要在会议、课程或社交平台播放通用视频。Desktop 可将短片另存为 1280 × 720、16:9 MP4；相关语音和编码组件会按需要准备。</li>\n <li><strong>页内演示：</strong> 右侧播放《Can We Reproduce Chinchilla Scaling》，使用用户提供的 4K、16:9 MP4，时长约 2 分 10 秒。点击播放器即可在当前页观看，也可以通过下方链接单独打开视频。</li>\n <li><strong>功能边界：</strong> 当前旁白为英文；生成内容仍需研究者核对科学准确性和可分享范围。Research film 用于解释和传播，不替代 .science 研究包、原始证据或复现验证。</li>\n</ul>\n<p>研究记录既可以被检查，也可以被讲清楚。下一页再把 Open-Science、专业能力和技术底座放回 AIPOCH 的整体产品架构中。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>右侧为用户于 2026-11-12 提供的《Can We Reproduce Chinchilla Scaling · 16×9 4k.mp4》，原始分辨率 3840 × 2160，时长 129.717 秒。封面取自同一视频。HTML 与 /open-science/assets/f25b88730c7cd12a.mp4 需保存在同一文件夹，可离线播放。</p>\n[Sources]<br>用户提供的本地 Research film MP4，2026-11-12。<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1：Research film 跨会话恢复可靠性</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.1.0\" target=\"_blank\" rel=\"noopener\">v1.1.0：Research films 与 MP4 导出</a><br><a href=\"https://github.com/aipoch/open-science/blob/main/packages/research-film/resources/authoring/README.md\" target=\"_blank\" rel=\"noopener\">Research film 生成、播放与导出流程</a>\n</details>\n </aside>\n</section>\n<section class=\"slide architecture\" data-page=\"15\" data-title=\"AIPOCH 构建开放的科研基础设施\">\n <div class=\"kicker\">14 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH 构建<span class=\"highlight-text\">开放的科研基础设施</span></h2>\n <p class=\"subtitle\">Open-Science 是面向研究者与全球社区的开放入口，底层由专业能力、执行引擎与技术服务共同支撑。</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH 产品架构建筑：服务、能力、执行与开放科研空间\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>面向研究者的开放科研工作台与社区入口<span class=\"benchmark-result\"><b>79.05 / 100</b>BIOMNIBENCH-DA PUBLIC 50 · INTERNAL</span></p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">SOON</span></h3><p>即将把专业能力组织为可执行、可恢复的科研 Workflow</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>24 内置 Skills · 525 Marketplace · 10 Specialists · 48 Connectors</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Open-Science Agent · Model · Compute</h3><p>6 种 Agent 选项 · 本地与远程 Runtime / Data</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>全球科研开源社区</strong>　贡献 · 验证 · 协作 · 复用</div></div>\n <p class=\"summary\">AIPOCH 将模型、工具与科研经验组织成可执行的科学能力，并通过 Open-Science 向全球社区开放。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看AIPOCH的整体产品布局，区分研究工作台、专业能力、审计服务和后续建设方向。</p>\n<ul>\n <li><strong>Open-Science：</strong> 研究者直接使用的工作台，把材料、方法、工具执行和结果检查连接起来。</li>\n <li><strong>Specialists、Skills与Connectors：</strong> 提供专业方法和工具连接，支撑工作台完成不同类型的任务。</li>\n <li><strong>MedSkillAudit：</strong> 提供Skill审计、评分与公开评测入口，帮助使用者了解能力的评价依据。</li>\n <li><strong>MedFlow：</strong> 是计划中的可恢复科研工作流方向，当前页面标注SOON。</li>\n <li><strong>BiomniBench-DA：</strong> 当前 README 报告的 Public 50 内部评测平均分为 79.05 / 100。该结果来自两个评审分数的等权平均，不代表统一评审条件下的官方排名。</li>\n</ul>\n<p>产品能力的完善，需要真实问题和专业经验持续参与。下面看不同角色可以怎样合作。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>这是概念架构，不是实际部署拓扑。建筑外围代表全球科研开源社区，参与能力贡献、验证、协作与复用。</p>\n[Sources]<br>年中汇报建筑图 page8-architecture-20260730-bgmatch.png；用户确认的架构迁移概念与产品状态；<a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science 当前 README：能力数量、算力后端与 BiomniBench-DA 内部评测说明</a>；<a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0 发布说明</a>；<a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH 官网</a>。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"16\" data-title=\"全球社区共同扩展能力边界\">\n <div class=\"kicker\">15 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">全球社区，共同扩展<span class=\"highlight-text\">能力边界</span></h2>\n <p class=\"subtitle\">社区贡献专业能力，AIPOCH 提供持续共建的基础设施与协作机制。</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>研究者</h3><p>使用社区贡献的科研能力，<br>并反馈真实问题。</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>领域专家</h3><p>将方法、规则与经验整理为<br>Specialist 或 Skill。</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-<br>Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>开发者</h3><p>接入工具、数据源与<br>工作流组件。</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>科研机构</h3><p>参与验证、复现与<br>合作研究。</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH 像素贴纸：AIPOCH 社区支持\"><div><span>AIPOCH / COMMUNITY INITIATOR</span><b>作为社区的发起者<br>与推动者</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>开放基础设施</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>线上线下 Workshop</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>课题组项目合作</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skills Hub<br>Specialist Marketplace</strong></div></div></div>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看不同参与者具体怎样合作，重点是把真实问题与专业方法带进来。</p>\n<ul>\n <li><strong>研究者：</strong> 可以提供实际任务和使用反馈，让产品改进围绕研究中遇到的问题。</li>\n <li><strong>领域专家：</strong> 可以从一个成熟方法开始，明确步骤、输入要求、适用边界和检查标准，与团队共同整理、测试和迭代。</li>\n <li><strong>开发者：</strong> 可以接入工具和数据源，让更多现有科研资源能够用于任务执行。</li>\n <li><strong>科研机构：</strong> 可以围绕具体课题开展验证、复现和联合研究，把能力放到实际场景中检验。</li>\n <li>AIPOCH通过基础设施、Workshops、Co-research和能力市场支持这些合作，方法是否公开发布由参与者另行决定。</li>\n</ul>\n<p>当合作中的方法和经验被保留下来，就有机会支持下一项研究。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>用户明确的全球科研开源社区定位、四类共建角色及 AIPOCH 社区支持方案；视觉素材由用户提供并处理为像素贴纸。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"17\" data-title=\"一次贡献，成为下一次发现的起点\">\n <div class=\"kicker\">16 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">一次贡献，可以成为<br>下一次<span class=\"highlight-text\">科学发现的起点</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">让真实研究中的方法与经验，经过验证、发布和复用，持续回到新的研究中。</p><div class=\"participation\"><div><b>USE</b><span>使用开放能力</span></div><div><b>CONTRIBUTE</b><span>贡献方法与组件</span></div><div><b>VALIDATE</b><span>审查、复现与反馈</span></div><div><b>CO-CREATE</b><span>围绕真实问题合作</span></div></div><p class=\"fine\" style=\"margin-top:29px\">我们希望与全球社区共同建立的协作机制。</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">共享的<br>科研能力<small>REUSABLE · VERIFIABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>真实问题</span><small>从科研需求出发</small></div><div class=\"wheel-node wn2\"><b>02</b><span>协作研究</span><small>连接不同专业</small></div><div class=\"wheel-node wn3\"><b>03</b><span>沉淀能力</span><small>Skill / Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>审查验证</span><small>方法、边界与结果</small></div><div class=\"wheel-node wn5\"><b>05</b><span>发布复用</span><small>保留来源与版本</small></div><div class=\"wheel-node wn6\"><b>06</b><span>反馈改进</span><small>新的案例与贡献</small></div></div></div>\n <p class=\"summary\">让一次研究积累的经验，成为更多研究者可以继续使用的能力。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一次合作之后，怎样把方法和反馈积累下来，支持后续研究。</p>\n<ul>\n <li>一项真实任务可以带来新的方法或改进建议，经过整理、测试后，成为其他任务可以按需使用的能力。</li>\n <li>复用时应保留版本、来源和适用条件，避免把一次有效的方法直接推广到所有场景。</li>\n <li>后续使用者遇到的新问题，可以帮助贡献者继续改进方法。</li>\n <li>更广泛的能力共享与跨机构实时协作，是我们继续建设的方向，不能当作当前已经全面可用的功能。</li>\n</ul>\n<p>最后，也邀请大家从自己的研究任务或成熟方法开始参与。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>这页表达希望共同形成的社区机制，不表示所有审核、发布、治理和合作流程都已作为产品功能上线。Hosted Public Skill Commons 与跨机构实时协作仍属于未来建设方向。</p>\n[Sources]<br>用户确认的社区愿景、共建循环与未来建设方向。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"18\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"连接全球社区的开放科研基础设施\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">让专业科研能力触手可及，<br>让选择权回到研究者手中。</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN-SOURCE<br>RESEARCH COMMUNITY<span class=\"version\">PRODUCT SNAPSHOT<br>v1.2.1 · 2026.11.11</span></div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>使用 Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>参与开源共建 ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>开展科研合作 ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"扫描二维码访问 Open-Science 官方产品页面\"><p>扫描进入 Open-Science</p></a>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">今天介绍的核心可以归纳为一句话：让研究者在可选择的技术环境中，把问题变成可以检查并继续推进的研究结果。</p>\n<ul>\n <li><strong>如果您正在开展研究：</strong> 可以带来一项已有论文、数据或分析目标的任务，我们从真实问题开始讨论怎样落地。</li>\n <li><strong>如果您已有成熟方法：</strong> 可以一起明确适用条件、输入输出和评价标准，再把方法整理成可复用的 Skill 或 Specialist。</li>\n <li><strong>如果您希望参与开源共建：</strong> 可以从使用、反馈和验证开始，也可以贡献工具、连接器或研究案例。</li>\n</ul>\n<p>谢谢大家。欢迎从一个具体问题开始交流。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>本版介绍对应 Open-Science v1.2.1 稳定版，产品发布日期为 2026.11.11，演示文稿更新于 2026.11.12。部分界面沿用历史截图，具体版本与来源见各页讲稿。二维码指向 https://aipoch.com/open-science。所有产品内容用于科学研究介绍，研究输出仍需专业审阅。</p>\n[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science 官方产品页</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">Open-Science v1.2.1 稳定版发布说明</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">开源仓库</a><br><a href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\">官方联系入口</a><br>建筑素材：AIPOCH 年中汇报。\n</details>\n </aside>\n</section>\n</main></div>\n<div class=\"key-hint\">← → 翻页　O 目录　N 讲稿　F 全屏</div>\n<nav class=\"controls\" aria-label=\"演示控制\"><button id=\"prevBtn\" aria-label=\"上一页\" title=\"上一页（←）\">←</button><span id=\"slideCounter\" class=\"counter\" aria-live=\"polite\">01 / 18</span><button id=\"nextBtn\" aria-label=\"下一页\" title=\"下一页（→）\">→</button><span class=\"sep\"></span><button id=\"overviewBtn\" aria-label=\"打开目录\" title=\"目录（O）\">目录</button><button id=\"notesBtn\" aria-label=\"打开讲稿\" title=\"讲稿与来源（N）\">讲稿</button><button id=\"fullBtn\" aria-label=\"全屏演示\" title=\"全屏（F）\">全屏</button><button id=\"helpBtn\" aria-label=\"使用帮助\" title=\"快捷键与打印\">?</button></nav>\n<dialog id=\"overviewDialog\" aria-labelledby=\"overviewTitle\"><div class=\"dialog-head\"><h2 id=\"overviewTitle\">Open-Science · 18 页目录</h2><button data-close=\"overviewDialog\" aria-label=\"关闭目录\">关闭 ×</button></div><div id=\"overviewGrid\" class=\"overview-grid\"></div></dialog>\n<dialog id=\"notesDialog\" aria-labelledby=\"notesTitle\"><div class=\"dialog-head\"><h2 id=\"notesTitle\">讲稿与来 ).innerHTML;}\n function showSlide(n,updateHash=true){current=clamp(n);slides.forEach((slide,index)=>{if(index!==current)slide.querySelectorAll('video,audio').forEach(media=>media.pause());});slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true');s.inert=i!==current;});deck.classList.toggle('chrome-light',!slides[current].classList.contains('slide-dark'));document.getElementById('slideCounter').textContent=`${String(current+1).padStart(2,'0')} / ${total}`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===total-1;document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';document.querySelectorAll('.overview-item').forEach((b,i)=>b.setAttribute('aria-current',i===current?'true':'false'));if(updateHash){try{history.replaceState(null,'',`#slide-${String(current+1).padStart(2,'0')}`);}catch{}}syncNotes();}\n function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}\n function toggleDialog(id){const d=document.getElementById(id);if(d.open){d.close();return;}dialogs.forEach(x=>x.open&&x.close());if(id==='notesDialog')syncNotes();d.showModal();}\n async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('当前浏览器不支持全屏，请使用浏览器的全屏菜单。');}catch{toast('可使用浏览器菜单进入全屏。');}}\n document.getElementById('prevBtn').addEventListener('click',()=>showSlide(current-1));document.getElementById('nextBtn').addEventListener('click',()=>showSlide(current+1));document.getElementById('overviewBtn').addEventListener('click',()=>toggleDialog('overviewDialog'));document.getElementById('notesBtn').addEventListener('click',()=>toggleDialog('notesDialog'));document.getElementById('fullBtn').addEventListener('click',fullscreen);document.getElementById('helpBtn').addEventListener('click',()=>toggleDialog('helpDialog'));document.getElementById('printBtn').addEventListener('click',()=>{document.getElementById('helpDialog').close();window.print();});\n document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));\n document.querySelectorAll('.slide .shot').forEach(shot=>{shot.setAttribute('role','button');shot.setAttribute('tabindex','0');shot.setAttribute('aria-label','查看完整产品截图');shot.setAttribute('title','点击查看未裁切的完整原图');const open=()=>{const source=shot.matches('.crop')?shot:shot.querySelector('.gallery-panel.active .crop');if(!source)return;const sourceImage=source.querySelector('img');if(!sourceImage)return;const full=document.createElement('figure');full.className='full-image-zoom';const image=sourceImage.cloneNode(true);image.removeAttribute('style');if(sourceImage.dataset.fullSrc)image.src=sourceImage.dataset.fullSrc;const width=sourceImage.dataset.fullSrc?1280:(sourceImage.naturalWidth||1),height=sourceImage.dataset.fullSrc?960:(sourceImage.naturalHeight||1);full.style.setProperty('--zoom-ratio',String(width/height));full.append(image);document.getElementById('imageZoom').replaceChildren(full);document.getElementById('imageTitle').textContent=sourceImage.alt;toggleDialog('imageDialog');};shot.addEventListener('click',open);shot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();open();}});});\n dialogs.forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));\n const overview=document.getElementById('overviewGrid');slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-item';b.setAttribute('aria-label',`跳转第${i+1}页 ${s.dataset.title}`);const num=document. y-visual-frame{height:198px}\nhtml[lang=\"en\"] .capabilities .journey-visual .crop{width:min(100%,calc(198px * var(--journey-shot-ratio)))}\nhtml[lang=\"en\"] .capabilities .journey-next{margin-top:8px;font-size:15px;line-height:1.2;padding:0 0 4px}\nhtml[lang=\"en\"] .ecosystem .content{margin-top:14px}\nhtml[lang=\"en\"] .ecosystem .gallery-frame{height:270px}\nhtml[lang=\"en\"] .ecosystem .marketplace-gallery{--market-shot-height:238px}\nhtml[lang=\"en\"] .ecosystem .skill-points{margin-top:6px}\nhtml[lang=\"en\"] .ecosystem .skill-points p{padding:4px 0;font-size:14px;line-height:1.35}\nhtml[lang=\"en\"] .ecosystem .summary{bottom:42px}\nhtml[lang=\"en\"] .architecture .content{margin-top:8px}\nhtml[lang=\"en\"] .architecture-layers{padding-top:0;width:620px}\nhtml[lang=\"en\"] .architecture-layer{padding:7px 0}\nhtml[lang=\"en\"] .architecture-layer h3{font-size:23px}\nhtml[lang=\"en\"] .architecture-layer p{font-size:15.5px;line-height:1.35;margin-top:4px;white-space:nowrap}\nhtml[lang=\"en\"] .architecture-layer .en{margin-bottom:5px}\n\n.science-package .section-title{font-size:57px}.science-package .subtitle{font-size:21px;max-width:1350px}.science-package-layout{display:grid;grid-template-columns:410px minmax(0,1fr);gap:46px;height:500px;margin-top:27px}.science-package-steps{border-top:1px solid var(--line)}.science-package-step{position:relative;display:grid;grid-template-columns:45px 1fr;gap:14px;width:100%;min-height:95px;padding:14px 12px 13px 0;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);transition:background .2s,color .2s}.science-package-step:before{content:\"\";position:absolute;left:-15px;top:14px;bottom:14px;width:3px;background:transparent}.science-package-step .sp-num{font:12px var(--mono);letter-spacing:.08em;color:#918d82;padding-top:5px}.science-package-step b{display:block;font-size:22px;line-height:1.3;font-weight:500}.science-package-step small{display:block;font-size:15px;line-height:1.45;color:var(--muted);margin-top:4px}.science-package-step[aria-selected=\"true\"]{background:#f1dd671b}.science-package-step[aria-selected=\"true\"]:before{background:#b99e25}.science-package-step[aria-selected=\"true\"] .sp-num{color:#927600}.science-package-stage{position:relative;height:500px;border:0;background:var(--surface);overflow:visible}\n.science-code-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surface)}\n.science-package .summary{bottom:52px;border-top:0}\n@media(max-width:650px){.key-hint{display:none}.controls{bottom:9px;right:50%;transform:translateX(50%);opacity:.8}.controls button{padding:0 7px;min-width:29px}.overview-grid{grid-template-columns:1fr}dialog{padding:23px}.help-list{grid-template-columns:1fr}.nav-context{display:none}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n@page{size:1600px 900px;margin:0}\n@media print{html,body{height:auto;overflow:visible;background:#fff}#viewport{position:static;display:block}#deck{width:1600px;height:auto;transform:none;overflow:visible}.slide,.slide.active{position:relative;display:flex!important;width:1600px;height:900px;break-after:page;page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-of-type{break-after:auto}.controls,.key-hint,.nav-bar,.progress-bar-nav,dialog,.toast{display:none!important}.gallery-panel:not(.active){display:none!important}.summary{bottom:45px}.slide:after{content:attr(data-page)\" / 18\";position:absolute;right:40px;bottom:20px;font:12px var(--mono);color:var(--sub)}}\n</style>\n</head>\n<body>\n<noscript><div class=\"no-js\">Open this presentation in a browser with JavaScript enabled.</div></noscript>\n<div id=\"viewport\"><main id=\"deck\" aria-label=\"AIPOCH Open-Science product introduction\">\n<div class=\"progress-bar-nav\"><div id=\"progressFill\" class=\"progress-bar-fill\"></div></div>\n<nav class=\"nav-bar\" aria-label=\"Brand\"><a class=\"nav-logo\" href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\"><span class=\"brand-mark\"><img src=\"/open-science/assets/e3824afb44bd1b7c.png\" alt=\"\"></span>AIPOCH</a><div class=\"nav-context\">OPEN-SCIENCE · PRODUCT & COMMUNITY · 2026.11</div></nav>\n\n<section class=\"slide slide-dark cover active\" data-page=\"01\" data-title=\"AIPOCH · Open-Science\" aria-label=\"Slide 1: AIPOCH Open-Science\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div>\n <img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Architectural linework representing open research infrastructure\">\n <div class=\"brand-lead\">AIPOCH <span style=\"font:12px var(--mono);letter-spacing:.17em;color:#aaa;vertical-align:middle;margin-left:22px\">AI4SCIENCE</span></div>\n <h1 class=\"hero-title\"><span class=\"highlight-text en\">Open-</span><br>Science</h1>\n <p class=\"cover-sub\">An open-source, model-agnostic workbench for real research</p>\n <p class=\"manifesto\">Put research expertise to work.<br>On your terms.</p>\n <span class=\"radar-node decor\" style=\"left:1120px;top:252px\"></span><span class=\"radar-node decor\" style=\"left:1455px;top:482px\"></span><span class=\"radar-node decor\" style=\"left:1230px;top:706px\"></span>\n <div class=\"cover-meta\">Science, Open to All</div>\n <p class=\"cover-label\">A shared workbench for<br>a global open research community</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">Hello. Today I’m introducing Open-Science, AIPOCH’s research workbench. Our slogan is “Science, Open to All.” AIPOCH combines expert research methods with AI execution so researchers can complete real studies and retain results that others can inspect and reuse.</p>\n<ul>\n <li><strong>Open-Science:</strong> An open-source, model-agnostic research workbench. Researchers choose the models, methods and execution environments that fit the task while retaining scientific judgment.</li>\n <li><strong>Today’s path:</strong> We will follow one research task through the workbench, then look at how experts and research institutions can contribute.</li>\n</ul>\n<p>Let’s begin with a practical question: how can years of expert research experience become useful inside a real task?</p>\n<details class=\"sources\"><summary>Sources and demo notes</summary>\n<p>“Model-agnostic” means researchers can choose models, providers and deployment paths. It does not mean the product works without models or that third-party inference and compute are free.</p>\n[Sources]<br>Company and product definitions supplied by AIPOCH. Architecture artwork: AIPOCH 2026 mid-year review. Visual reference: AIPOCH — Skill Infrastructure for Medical Research.\n</details>\n</aside>\n</section>\n\n<section class=\"slide\" data-page=\"02\" data-title=\"Turn research experience into executable scientific capability\">\n <div class=\"kicker\">01 / ABOUT AIPOCH</div>\n <h2 class=\"section-title\">Turn research experience into <span class=\"highlight-text\">executable scientific capability</span></h2>\n <p class=\"mission-intro\">AIPOCH is an AI4Science company. We combine AI computation and reasoning with the research experience experts build over years of practice, turning scattered knowledge, resources and workflows into scientific capabilities that can be executed, verified and reused.</p>\n <div class=\"mission-formula\">\n  <div class=\"formula-part\"><span class=\"label\">MACHINE INTELLIGENCE</span><div class=\"en-big\">AI Compute<br>& Reasoning</div><div class=\"cn\">Compute · Reason · Execute</div></div><div class=\"formula-symbol\">×</div>\n  <div class=\"formula-part\"><span class=\"label\">HUMAN EXPERTISE</span><div class=\"en-big\">Research<br>Experience</div><div class=\"cn\">Experience · Methods · Judgment · Boundaries</div></div><div class=\"formula-symbol\">→</div>\n  <div class=\"formula-part formula-result\"><span class=\"label\" style=\"color:#655b2b\">SCIENTIFIC CAPABILITY</span><div class=\"en-big\">Knowledge you can execute.<br>Experience you can reuse.</div><div class=\"cn\">Tested and refined in real research</div></div>\n </div>\n <p class=\"summary\">Bring research experience into real studies and accelerate scientific discovery.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH turns expert practice into capability researchers can actually call and run.</p><p>AI contributes computation, reasoning, information processing and execution. Researchers contribute methods, domain knowledge, standards of judgment and boundaries of use. Together, they allow scientific know-how to enter real tasks, be inspected and be reused across studies.</p><p>Open-Science is where researchers use these capabilities—and where the community can improve them over time.</p><div class=\"sources\">[Sources]<br>AIPOCH company definition and product materials supplied for the 2026 mid-year review.</div></aside>\n</section>\n\n<section class=\"slide slide-surface\" data-page=\"03\" data-title=\"Research needs more than a stronger model\">\n <div class=\"kicker\">02 / THE RESEARCH GAP</div>\n <h2 class=\"section-title\">Research needs more than<br><span class=\"highlight-text\">a stronger model</span></h2>\n <p class=\"subtitle\">Real research must connect evidence, methods, tools, compute environments and results.</p>\n <div class=\"fragmented\">\n  <div class=\"fragment\"><div class=\"index\">01</div><h3>Question</h3><div class=\"en\">INTENT</div><p class=\"gap-note\">Research goals<br>repeatedly explained</p></div>\n  <div class=\"fragment\"><div class=\"index\">02</div><h3>Evidence</h3><div class=\"en\">SOURCES</div><p class=\"gap-note\">Papers and data<br>searched separately</p></div>\n  <div class=\"fragment\"><div class=\"index\">03</div><h3>Method</h3><div class=\"en\">DESIGN</div><p class=\"gap-note\">Expert methods<br>depend on experience</p></div>\n  <div class=\"fragment\"><div class=\"index\">04</div><h3>Analysis</h3><div class=\"en\">EXECUTION</div><p class=\"gap-note\">Code and environments<br>split across tools</p></div>\n  <div class=\"fragment\"><div class=\"index\">05</div><h3>Validation</h3><div class=\"en\">CHECKS</div><p class=\"gap-note\">Process and results<br>hard to align</p></div>\n  <div class=\"fragment\"><div class=\"index\">06</div><h3>Outputs</h3><div class=\"en\">ARTIFACTS</div><p class=\"gap-note\">Artifacts and records<br>hard to reuse</p></div>\n </div>\n <p class=\"problem-foot\">Current breaks: <span style=\"color:#111\">lost context, disconnected tools, interrupted execution and unclear provenance</span></p>\n <p class=\"summary\">Connect the fragmented tools so research can continue from existing work.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Research needs an environment that carries the work forward across tools, sessions and execution steps.</p><p>This is not a claim that every AI chat tool is unable to execute. The point is that research still depends on persistent context, specialist methods, compute and validation. Researchers are often left to move information, configure environments, check methods and assemble outputs themselves.</p><div class=\"sources\">[Sources]<br>Narrative confirmed by AIPOCH; structure adapted from the “Fragmented Research Workflow” in the reference deck.</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"04\" data-title=\"From a question, straight into real research\">\n <div class=\"kicker\">03 / MEET OPEN-SCIENCE</div>\n <h2 class=\"section-title\">From a question, straight into <span class=\"highlight-text\">real research</span></h2>\n <p class=\"subtitle\">Connect AI models, specialist scientific capabilities and real research workflows.</p>\n <div class=\"content split wide-visual\">\n  <div class=\"overview-copy\"><p class=\"body-text\">Open-Science is AIPOCH’s open-source, model-agnostic research workbench.<br><br>Choose tools freely and inspect the execution. For artifact versions with complete capture, rerun the computation and compare outputs.</p><div class=\"key-values\"><div class=\"key-value\"><b>Open source</b><span>CODE YOU CAN INSPECT</span></div><div class=\"key-value\"><b>Your choice</b><span>MODEL CHOICE</span></div><div class=\"key-value\"><b>Transparent process</b><span>SEE EACH STEP</span></div><div class=\"key-value\"><b>Artifact verification</b><span>RERUN &amp; COMPARE OUTPUTS</span></div></div></div>\n  <div><figure class=\"crop shot workbench-home full-gif\"><img alt=\"Local Open-Science v1.2.1 research session with Notebook work, tool calls, findings and generated figures\" src=\"/open-science/assets/1bd785ee750bd9c5.png\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><div class=\"shot-caption\"><span>OPEN-SCIENCE · CURRENT PRODUCT VIEW</span><span>LOCAL v1.2.1 · CLICK TO ENLARGE</span></div><div class=\"product-rail\"><span>Projects</span><span>Artifacts</span><span>Provenance</span><span>Verification</span></div></div>\n </div>\n <p class=\"summary\">Put the research question, specialist capabilities and real execution in one workbench.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science brings the project, tools, computation and outputs together. Reproducibility checks apply to individual artifact versions.</p><p>For verifiable versions with complete code, input and environment records, the Reproducibility check restores the environment in an isolated workspace, reruns the captured computation and compares the generated files. This is an optional check, distinct from Reviewer checks; neither is a required step in every study.</p><p>The right-hand image was captured locally from Open-Science v1.2.1 on November 12, 2026. It shows Notebook work, tool calls, findings, sources, generated files and figures working together in one workspace. It illustrates the product workflow and is not a customer case or performance claim.</p><p>A check covers the captured artifact version, not a full-session replay or the scientific validity of a conclusion. Historical artifacts with incomplete evidence may be unavailable for verification.</p><div class=\"sources\">[Sources]<br>Local Open-Science v1.2.1 research execution and result captures, November 12, 2026.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">Open-Science v1.2.1 release notes</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"One workbench, a global scientific commons\">\n <div class=\"kicker\">04 / THE GLOBAL SCIENTIFIC COMMONS</div>\n <h2 class=\"section-title\">One workbench,<br>a <span class=\"highlight-text\">global scientific commons</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">Open-Science is shared infrastructure,<br>where participants across disciplines collaborate in one space.</p><div class=\"commons-share\"><h3>The community shares more than code.</h3><p>Code · Methods · Capability packages<br>Workflows · Validation records · Research experience</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">5.5K</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub interest · Snapshot 2026.11.11</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Four groups collaborating in the Open-Science shared research space\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"A circular shared research workspace with four groups: a researcher analyzing data, domain experts discussing methods, a developer orchestrating a workflow, and an institutional research team working with laboratory equipment.\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"Explore how four community roles contribute\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"Researcher contribution path\">Researchers</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"Domain expert contribution path\">Domain experts</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"Developer contribution path\">Developers</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"Research institution contribution path\">Institutions</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">Choose a role to see how each group contributes.</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">CO-BUILDING LOOP</span><span>Use</span><span class=\"cycle-arrow\">↔</span><span>Discuss</span><span class=\"cycle-arrow\">↔</span><span>Review</span><span class=\"cycle-arrow\">↔</span><span>Contribute</span><span class=\"cycle-arrow\">↔</span><span>Improve</span></p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page answers two questions: who is building Open-Science together, and what can each participant contribute?</p><p><strong>Researchers</strong> bring real questions and materials so capability development starts from real scientific needs. <strong>Domain experts</strong> contribute methods, judgment criteria and boundaries of use. <strong>Developers</strong> connect tools and data sources. <strong>Research institutions</strong> support validation, collaboration and long-term maintenance.</p><p>The community can share code, Skills, workflows and validation records. Other researchers can reuse these resources and inspect how they work. As of November 11, 2026, the Open-Science GitHub repository had 5.5K Stars. This is a snapshot of public interest, not a user count or a measure of research performance.</p><p>Contributors decide whether to share and what to make public. Using the product does not require publishing private data or unpublished results.</p><div class=\"sources\">[Sources]<br>Roles, shared resources and the co-building loop were specified by AIPOCH. Concept illustration: AIPOCH shared-research-workbench artwork. GitHub snapshot: 5.5K Stars on 2026-11-11.<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub repository</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"Six-step research journey: from project to package\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">One research question, toward <span class=\"highlight-text\">an inspectable result</span></h2>\n <p class=\"subtitle\">Using result reproduction as an example, six steps carry one study through verification, .science packaging and a Research film.</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">EXAMPLE TASK</span><p>I have the paper and the data. I want to reproduce the main result.</p><span class=\"journey-hint\">Choose a step to follow the workflow →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"Six steps from project setup to verification, packaging and sharing\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"Step 1: Set up the project\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">Set up the project</span><span class=\"journey-capability\">Persistent context</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"Step 2: Load specialist capabilities\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">Load expertise</span><span class=\"journey-capability\">Specialists & Skills</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"Step 3: Choose models and runtime\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">Choose your stack</span><span class=\"journey-capability\">Agent · Model<br>Local · Remote · Runtime</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"Step 4: Approve the plan\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">Approve and execute</span><span class=\"journey-capability\">Execution · orchestration</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"Step 5: Inspect outputs and annotate only if needed\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">Inspect outputs</span><span class=\"journey-capability\">Artifact · Optional revision</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"Step 6: Verify the captured artifact, then package and share the research\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">Verify, package, explain</span><span class=\"journey-capability\">Verification · .science · Research film</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">Define the target before you begin.</h3><p class=\"journey-detail-copy\">Create a project, specify the result to reproduce, and add the paper and data. Every session that follows can use the same context.</p><p class=\"journey-result\"><span>OUTPUT</span>A project anchored in the question and source material</p><button class=\"journey-next\" data-journey-to=\"1\">Next: load specialist capabilities →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/4aa6aabf212801d6.png\" alt=\"Local Open-Science v1.2.1 home with projects, recent sessions and research records\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Create a project · Set the goal and context · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">Bring the right expertise into the project.</h3><p class=\"journey-detail-copy\">Select a Specialist, load the Skills the task needs, and connect the right tools and data sources.</p><p class=\"journey-result\"><span>OUTPUT</span>A study-specific set of scientific capabilities</p><button class=\"journey-next\" data-journey-to=\"2\">Next: choose the model and runtime →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/a221fc5a65f06ad2.png\" alt=\"Local Open-Science v1.2.1 Resource Center with installed Skills and version status\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Skills · Find and load on demand · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">Choose how and where the work runs.</h3><p class=\"journey-detail-copy\">Select a model and agent, configure Python or R, then connect SSH, Slurm, Kubernetes, Hugging Face Jobs, Modal or Ray when the study needs more compute.</p><p class=\"journey-result\"><span>OUTPUT</span>A stack matched to the study</p><button class=\"journey-next\" data-journey-to=\"3\">Next: approve the plan →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/dc5411da324ab7ee.png\" alt=\"Local Open-Science v1.2.1 model settings with the active model, provider and connection status\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Model · Choose what the research uses · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">Approve the plan before anything runs.</h3><p class=\"journey-detail-copy\">Review the plan and permissions. The main agent can then delegate work to sub-agents, call tools and run code while progress stays visible.</p><p class=\"journey-result\"><span>OUTPUT</span>Code, intermediate results and a complete run record</p><button class=\"journey-next\" data-journey-to=\"4\">Next: inspect the outputs →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/1bd785ee750bd9c5.png\" alt=\"Local Open-Science v1.2.1 execution session with Notebook work, tool steps and research outputs\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Session Plan · Review before execution · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">Review the result. Revise only if needed.</h3><p class=\"journey-detail-copy\">Figures, text and notebooks are ready to inspect or deliver. If a change is needed, select content or mark an image location and send it to the Agent.</p><p class=\"journey-result\"><span>OUTPUT</span>Reviewable outputs with an optional revision path</p><button class=\"journey-next\" data-journey-to=\"5\">Next: verify, package and share →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0416666667\"><figure class=\"crop shot\" data-crop=\"artifactAnnotation|1120,590,980,480\" style=\"aspect-ratio:980/480\"><img src=\"/open-science/assets/4615fe26a153eaf7.png\" alt=\"Local Open-Science v1.2.1 research result with findings, sources, generated files and chart preview\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Artifacts · Annotate only when a change is needed · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">Verify the result, then package the research.</h3><p class=\"journey-detail-copy\">Rerun the captured artifact version and compare outputs. Export a .science package for read-only inspection, or generate a narrated Research film from the same record.</p><p class=\"journey-result\"><span>OUTPUT</span>A verification record, .science package and narrated film</p><a class=\"journey-next\" href=\"#slide-13\">Next: the .science research package →</a></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.783687943262411\"><figure class=\"crop shot\" data-crop=\"artifactVerification|1275,228,785,282\" style=\"aspect-ratio:785/282\"><img src=\"/open-science/assets/c40d244a46a6fa9f.png\" alt=\"Local Open-Science v1.2.1 .science session package with required evidence, optional files, versions and dependencies\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div><figcaption>Reproducibility · Verified synthetic example · Click for the full screenshot</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Project context, files and provenance stay connected. After verification, export a .science package or generate a Research film for explanation.</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">This page shows the complete path of one research task. It is the overview map for the capabilities covered in the next slides.</p>\n<ul>\n <li><strong>Set up the project:</strong> Define the result to reproduce and add the paper and data so every session starts from the same material.</li>\n <li><strong>Load expertise:</strong> Add the Specialist or Skills the task needs so the analysis follows clear professional requirements.</li>\n <li><strong>Choose the stack:</strong> Select the model, agent and runtime. Remote jobs can use SSH, Slurm, Kubernetes, Hugging Face Jobs, Modal or Ray.</li>\n <li><strong>Approve the plan:</strong> Review the approach before tools and code run. Delegation and additional review remain optional.</li>\n <li><strong>Inspect outputs:</strong> Use the figure, report or Notebook as delivered when it meets the need. Revise only when a change is required.</li>\n <li><strong>Verify, package and share:</strong> Rerun a captured artifact version and compare the outputs. Then export a .science package for read-only inspection or generate a Research film for presentation. Recipients Fork when they need to continue.</li>\n</ul>\n<p>These capabilities are available as the task requires. A project does not have to perform every operation.</p>\n<details class=\"sources\"><summary>Sources and demo notes</summary>\n<p>The example task is illustrative, not a customer quote or performance claim. Project, Skills, model and environment, execution, output and provenance views were captured locally from Open-Science v1.2.1 on November 12, 2026. Together they explain how one study progresses, not a single continuous customer run.</p>\n<p>Verification, packaging, Research film and remote-compute descriptions are updated through v1.2.1. Some journey screenshots retain the v0.26.0 snapshot from September 7, 2026.</p>\n[Sources]<br>Local Open-Science v1.2.1 project, Resource Center, settings, execution, artifact and export captures, November 12, 2026.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1: unified Resource Center, Agent updates, CSV export and compact packages</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: remote compute and step discussions</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.1.0\" target=\"_blank\" rel=\"noopener\">v1.1.0: Research films and literature tools</a>\n</details>\n</aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"Research does not end with one conversation\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">Research does not end with <span class=\"highlight-text\">one conversation</span></h2>\n <p class=\"subtitle\">Organize research by project so context, materials and past decisions keep accumulating.</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"Persistent research workspace features\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>Persistent projects and sessions</b><small>Keep conversations, files and outputs together.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>Shared project context</b><small>Carry goals, definitions and constraints into each new session.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-memory\"><span class=\"num\">03</span><span><b>Durable research memory</b><small>Enable when needed and manage stable research preferences.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">04</span><span><b>Branches, Fork &amp; step discussions</b><small>Keep the path; ask from a specific imported step.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">05</span><span><b>Global search &amp; session references</b><small>Search: ⌘K / Ctrl+K · Reference a session: #</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">06</span><span><b>Side chat: independent parallel tabs</b><small>Run multiple tabs alongside the main session.</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.3333333333333333\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/047e050350ef5ae1.png\" data-full-src=\"/open-science/assets/d331e9c96bfc9a9b.png\" alt=\"Open-Science v1.2.1: Projects and sessions: saved discussions, generated files and output preview\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Project sessions and research outputs</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/a29ed25752359cc2.png\" data-full-src=\"/open-science/assets/7dc1ab115e3c9bf9.png\" alt=\"Open-Science v1.2.1: Agent Context in Project Settings, with a clearly labeled unsaved example\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Project Settings / Agent Context (unsaved example)</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-memory\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/587d2ad7a597c66f.png\" data-full-src=\"/open-science/assets/4ee334b24ff4ca29.png\" alt=\"Open-Science v1.2.1: Add-note form in Memory settings, with an unsaved example; Memory remains off\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Memory note form (Memory off, example not saved)</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/bbb52356e4a705c6.png\" data-full-src=\"/open-science/assets/527d635ebb94603f.png\" alt=\"Open-Science v1.2.1: Fork entry in the current session actions menu; no copy created\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Fork in the session actions menu</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/bdd5aeab13734042.png\" data-full-src=\"/open-science/assets/270c0d2c3129301c.png\" alt=\"Open-Science v1.2.1: Actual global search results for electricity, with projects, messages, sessions and Library categories\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Global Search: matching projects and messages</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.3333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" style=\"aspect-ratio:4/3\"><img src=\"/open-science/assets/dbad4a230cfc6342.png\" data-full-src=\"/open-science/assets/cad815b8eb78972e.png\" alt=\"Open-Science v1.2.1: Independent Side chat composer beside the main session; demonstration question not sent\" style=\"position:static;width:100%;height:100%;object-fit:contain\"></figure><figcaption>Independent Side chat panel (draft not sent)</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Every study continues from existing work without repeating the same background.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page explains how research continues across sessions while different research paths remain separate.</p><p><strong>Projects and sessions:</strong> Keep discussions, files and outputs in one project so later sessions continue from existing work. <strong>Project context:</strong> Put shared goals and constraints into the project so every session follows the same background. <strong>Research memory:</strong> Add notes in Memory and enable it when needed. This screenshot shows an unsaved example with Memory still off. Recheck time-sensitive facts.</p><p><strong>Conversation branches and Fork:</strong> Start another path without losing the original. From imported .science research, open a child discussion linked to a specific step; Fork only when execution or editing is needed. <strong>Side chat:</strong> Use independent tabs for a statistical-method question or figure interpretation while the main task continues. <strong>Global search and session references:</strong> Find earlier discussions, files and outputs, then reference a prior session without copying the whole record.</p><div class=\"sources\">[Sources]<br>Six local Open-Science v1.2.1 screenshots from November 12, 2026: project sessions and outputs, Project Settings / Agent Context, the Memory note form, the Fork menu, actual global search results and the Side chat panel. Context and Memory text are explicitly labeled unsaved examples. Existing settings were not changed. The Side chat question was not sent. The Fork screenshot shows the entry point, not a created copy or a running branch. Click each focused image to inspect the original full-window capture.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1: workspace and resource-management updates</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: step discussions and the clearer Fork action</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface literature\" data-page=\"08\" data-title=\"From literature discovery to evidence you can question and cite\">\n <div class=\"kicker\">07 / LITERATURE REFERENCE LIBRARY</div>\n <h2 class=\"section-title\">From literature discovery to<br><span class=\"highlight-text\">evidence you can question and cite</span></h2>\n <p class=\"subtitle\">Import from Zotero or PDF. Resume batch overviews, manage references through CLI or MCP, ask about passages, extract figures and export bibliography.csv.</p>\n <div class=\"content literature-interactive gallery\" data-gallery=\"literature\">\n  <div class=\"literature-tabs\" role=\"tablist\" aria-label=\"Literature Reference Library features\">\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"literature-library\"><span class=\"literature-num\">01</span><span><b>Zotero / PDF import</b><small>Import Zotero 10+ libraries or PDFs in bulk</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-reference\"><span class=\"literature-num\">02</span><span><b>Records, overviews &amp; notes</b><small>Metadata, resumable batch overviews and personal-note search</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-fulltext\"><span class=\"literature-num\">03</span><span><b>Read in order &amp; ask</b><small>Follow document logic and ask about a selected sentence</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-figures\"><span class=\"literature-num\">04</span><span><b>Extract figures &amp; tables</b><small>Export tables and read with the Agent</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-citation\"><span class=\"literature-num\">05</span><span><b>Citations &amp; integrity</b><small>Export citations; check DOI retractions and corrections on demand</small></span></button>\n  </div>\n  <div class=\"literature-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"literature-library\"><figure class=\"crop\" data-crop=\"literatureLibrary|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/869903d02b06e40e.png\" alt=\"Local Open-Science v1.2.1 Literature Library with cross-project search, filters, ratings, attachments and deduplication\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>LIBRARY · Search, filter, rate and deduplicate across projects</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-reference\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureReference|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/5b89ac510774a579.png\" alt=\"Local Open-Science v1.2.1 literature record with DOI, authors, tags, attachments and project links\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>RECORD · DOI, authors, tags, attachments and project links</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-fulltext\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFullText|300,0,2260,1271\" style=\"aspect-ratio:2260/1271\"><img src=\"/open-science/assets/d772b86c009a2161.png\" alt=\"Local Open-Science v1.2.1 PDF reader with original text, figures, annotations, translation and Read with agent\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>READ &amp; ASK · Highlight a passage and ask the Agent in context</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-figures\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFigures|160,134,1868,838\" style=\"aspect-ratio:1868/838\"><img src=\"/open-science/assets/4f88c0c16a89e35c.png\" alt=\"Local Open-Science v1.2.1 Read with agent flow for bringing a paper into a selected project\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>FIGURES &amp; TABLES · Extract structure, export tables and read with the Agent</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-citation\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureCitation|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/511f3bcdb66cc547.png\" alt=\"Local Open-Science v1.2.1 citation styles including APA, MLA, Chicago, Vancouver, IEEE, Nature and AMA\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><figcaption>CITATION STYLES · LOCAL v1.2.1</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Bring literature, personal notes and extracted figures into the research, while keeping every answer traceable to the original paper.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page shows how literature enters a project and becomes evidence that researchers can question, cite and trace back to the original.</p><p><strong>Zotero and PDF import:</strong> Import a Zotero 10+ library or a batch of PDFs with records, attachments, tags and collection structure. <strong>Batch overviews and personal notes:</strong> Resume overview generation after interruptions without repeating completed papers, and search personal notes across the library. <strong>Automatic reading order:</strong> Follow the document’s logical order in complex, multi-column PDFs.</p><p><strong>Passage questions:</strong> Select a specific sentence and ask within the paper’s context. <strong>Figure and table extraction:</strong> Extract structure and export tables for further analysis, then check the result against the original. <strong>CLI, MCP and CSV:</strong> Search and maintain the library from the command line or an MCP client. v1.2.1 exports selected references to bibliography.csv with DOI, tags, notes and integrity state.</p><p>Extraction and Agent answers still require comparison with the original paper. Full-text availability depends on source, license and network conditions.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.3\" target=\"_blank\" rel=\"noopener\">v1.0.3: literature discovery, supplementary materials, Smart Screening and PDF workflows</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.4\" target=\"_blank\" rel=\"noopener\">v1.0.4: DOI retraction and correction checks</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.5\" target=\"_blank\" rel=\"noopener\">v1.0.5: reading status and filters</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.6\" target=\"_blank\" rel=\"noopener\">v1.0.6: Zotero import, personal-note search and automatic PDF reading order</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.1.0\" target=\"_blank\" rel=\"noopener\">v1.1.0: literature CLI, MCP and resumable batch overviews</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: fixed-layout PDF translation recovery</a><br>The Library, PDF reader, Read with agent and citation-style views were captured locally from Open-Science v1.2.1 on November 12, 2026.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1: literature and bibliography.csv updates</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"09\" data-title=\"You decide the model, Agent, compute and environment\">\n <div class=\"kicker\">08 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">Model, Agent, compute and environment. <span class=\"highlight-text\">You decide.</span></h2>\n <p class=\"subtitle\">Choose tools around the research task. Do not reshape the research around one tool.</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Pick the agent</h3><p>Open-Science Agent is the default; Codex subscriptions, Claude Fable 5.2, OpenCode, CodeBuddy and Pi remain available.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>Choose the model</h3><p>Connect model providers, compatible gateways or subscription accounts. Switch models within a task.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>Bring your own compute</h3><p>Run locally or use SSH, Slurm, Kubernetes, Hugging Face Jobs, Modal or Ray.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>Set the runtime</h3><p>Python, R and REPL kernels with repair and network protection.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>Connect your data</h3><p>48 built-in Connectors, official APIs and custom MCP.</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Technology choices\"><button role=\"tab\" aria-selected=\"true\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackAgent|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/f4722a17f0de62df.png\" alt=\"Local Open-Science v1.2.1 Agent settings with Open-Science Agent, Claude Agent, OpenCode and Codex\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackModel|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/dc5411da324ab7ee.png\" alt=\"Local Open-Science v1.2.1 model settings with active model, provider and connection status\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackCompute|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/ca2c04e5a04689b0.png\" alt=\"Local Open-Science v1.2.1 Compute settings with SSH, Hugging Face Jobs, Modal, Kubernetes and Ray\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackRuntime|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/330610a8f735bb5c.png\" alt=\"Local Open-Science v1.2.1 Runtimes with Notebook environments, Python and network protection\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackConnectors|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/43dc5bd00178ec89.png\" alt=\"Local Open-Science v1.2.1 Connectors with 48 installed integrations and unified management\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure></div>\n </div><div class=\"shot-caption\"><span>CHOOSE YOUR STACK</span><span>SELECT A TAB TO SWITCH PRODUCT VIEWS</span></div><p class=\"small-note\">If you use third-party models, remote services or connectors, their data policies and pricing apply.</p></div></div>\n <p class=\"summary\">The technical stack can change. The research goal and the right to choose stay with the researcher.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">This page covers the technical foundation. Researchers choose the Agent, model, compute and runtime for the task instead of fixing one stack in advance.</p><p><strong>Agent framework:</strong> New installs use the built-in Open-Science Agent by default. v1.2.1 adds Codex subscription sign-in, Claude Fable 5.2 and explicit output limits while preserving the other Agent options. <strong>Model service:</strong> Switch among providers, compatible endpoints or subscription logins when capability, cost or account requirements differ. <strong>Compute and runtime:</strong> Run small tasks locally. For remote work, use SSH, Slurm, Kubernetes, Hugging Face Jobs, Modal or Ray. Each external submission confirms the target, command, resources and outputs, and collection can resume after a restart.</p><p><strong>Connectors and MCP:</strong> Add research databases, official APIs or existing tools only when the task needs them. Cloud models, remote endpoints and third-party connectors may send requests to those services. Pricing, data policy and availability depend on the selected configuration.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.0\" target=\"_blank\" rel=\"noopener\">v1.0.0: four Agents, models, runtimes, compute and research connections</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.4\" target=\"_blank\" rel=\"noopener\">v1.0.4: standalone CLI MCP and GitHub Skills import</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.0.6\" target=\"_blank\" rel=\"noopener\">v1.0.6: Node/npm runtime support for custom stdio Connectors</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.0\" target=\"_blank\" rel=\"noopener\">v1.2.0: built-in Open-Science Agent and cloud compute backends</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Current README: 48 built-in Connectors and current Agent options</a><br>Agent, Model, Compute, Runtimes and Connectors were captured locally from Open-Science v1.2.1 on November 12, 2026.<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v1.2.1\" target=\"_blank\" rel=\"noopener\">v1.2.1: Agent, cloud sign-in and output limits</a></div></aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"10\" data-title=\"Global scientific capabilities, on demand\">\n <div class=\"kicker\">09 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">Global scientific capabilities, <span class=\"highlight-text\">on demand</span></h2>\n <p class=\"subtitle\">The unified Resource Center manages Skills, Connectors, Specialists and Use Cases while preserving browsing context.</p>\n <div class=\"content\"><div class=\"gallery marketplace-gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Skills and Specialist Marketplace features\"><button role=\"tab\" aria-selected=\"true\" data-select=\"discover\">Discover</button><button role=\"tab\" aria-selected=\"false\" data-select=\"install\">Install</button><button role=\"tab\" aria-selected=\"false\" data-select=\"batch\">Bulk install</button><button role=\"tab\" aria-selected=\"false\" data-select=\"updates\">Updates</button><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"false\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"discover\" role=\"tabpanel\" style=\"--market-shot-ratio:2.85714\"><figure class=\"crop\" data-crop=\"marketplaceDiscover|216,90,1400,490\" style=\"aspect-ratio:1400/490\"><img src=\"/open-science/assets/38472675cd5635c0.png\" alt=\"Local Open-Science v1.2.1 Skills Marketplace with search, sources and installation status\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">Search and filter for the Skill your task needs. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"install\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceInstall|506,96,840,390\" style=\"aspect-ratio:840/390\"><img src=\"/open-science/assets/a221fc5a65f06ad2.png\" alt=\"Local Open-Science v1.2.1 installed Skills with sources, versions and update status\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">Check the version and source before installing. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"batch\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceBatch|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/38472675cd5635c0.png\" alt=\"Local Open-Science v1.2.1 Skills Marketplace with capability entries and install actions\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">Select several Skills and confirm installation together. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"updates\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceUpdates|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/a221fc5a65f06ad2.png\" alt=\"Local Open-Science v1.2.1 installed Skills and version status\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">Review and confirm updates. None pending in this view. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\" style=\"--market-shot-ratio:1.90698\"><figure class=\"crop specialist-shot\" data-crop=\"marketplaceSpecialists|506,98,820,430\" style=\"aspect-ratio:820/430\"><img src=\"/open-science/assets/dbb5cd06c984f89d.png\" alt=\"Local Open-Science v1.2.1 Specialists with installed expert capabilities and versions\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">Browse Specialists for a defined research task. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"skills\" role=\"tabpanel\" style=\"--market-shot-ratio:1.71429\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/38472675cd5635c0.png\" alt=\"Local Open-Science v1.2.1 Skills Marketplace for discovering, installing and reusing research methods\" style=\"position:static;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center\"></figure><p class=\"marketplace-caption\">Load, create or import your own Skill. Click to enlarge.</p></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>Current catalog:</b> 24 built-in Skills, 525 Marketplace Skills, 10 Specialists and 48 built-in Connectors.</span></p><p><span>02</span><span class=\"skill-copy\"><b>Load, create and reuse freely:</b> create a Skill in natural language, import from GitHub, or start from a validated research package in the home case library.</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN CAPABILITY MARKETPLACE · USE &amp; CONTRIBUTE</span></div><p class=\"resource-snapshot\">GitHub Stars snapshot · 2026.11.02</p>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense mark\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">55.7K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · Research and analysis across disciplines</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic mark\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">187K ★ ↗</span></div><p class=\"source-desc\">Anthropic Agent Skills · Document, design and developer workflows</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind mark\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">3.4K ★ ↗</span></div><p class=\"source-desc\">Science Skills · Genomics, structural biology and scientific search</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-l
