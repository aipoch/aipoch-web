<!doctype html><html lang="en"><meta charset="utf-8"><title>Local design capture</title><label>Filename <input id="filename" value="figma-default.svg"></label><label>Copied design data <textarea id="capture" rows="12" cols="90"></textarea></label><button id="save">Save locally</button><p id="status"></p><script>document.querySelector('#save').onclick=()=>{const text=document.querySelector('#capture').value;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=document.querySelector('#filename').value;a.click();document.querySelector('#status').textContent=text.length+' characters saved';setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></html>
